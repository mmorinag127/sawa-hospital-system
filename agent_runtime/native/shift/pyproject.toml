[project]
name = "shift-scheduler"
version = "0.1.0"
description = "Generic web-based shift scheduling optimizer for Cloud Run, Cloud SQL, GCS, and OR-Tools."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "anyio>=4.14.2,<5",
    "cryptography>=50.0.2,<51",
    "pyasn1>=0.6.4,<0.7",
    "urllib3>=2.8.0,<3",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "ortools>=9.10,<10.0",
    "psycopg[binary]>=3.2,<4.0",
    "google-cloud-storage>=2.18,<4.0",
    "google-cloud-tasks>=2.16,<3.0",
    "google-auth>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "jpholiday>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-testmon==2.2.0",
    "ruff>=0.6,<1.0",
    "httpx>=0.27.0,<0.29.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["shift_scheduler_backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
