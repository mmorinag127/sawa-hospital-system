          - [0.76, 0.600, 0.08, 0.075]
          - [0.36, 0.685, 0.08, 0.075]
          - [0.44, 0.685, 0.08, 0.075]
          - [0.52, 0.685, 0.08, 0.075]
          - [0.60, 0.685, 0.08, 0.075]
