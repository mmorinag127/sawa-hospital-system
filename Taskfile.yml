version: "3"

vars:
  PROJECT_ID: "mythic-lattice-483204-t8"
  GCP_SA_KEY: "/Users/mmorinag/Sawa/2025.12/MythicLatticeData.json"
  FAX_PDF: "/Users/mmorinag/Sawa/2025.12/input_example/11.fax000312975 1214~.pdf"
  CLOUDRUN_REGION: "asia-northeast1"
  CLOUDRUN_WEB_SERVICE: "web-dev"
  CLOUDRUN_WEB_URL: "https://web-dev-m3j47i2tgq-an.a.run.app"
  LOCAL_DB_URI: "sqlite:////Users/mmorinag/Sawa/2025.12/workspace/dev.db"
  YOMITOKU_TEST_INPUT_DIR: "/Users/mmorinag/Sawa/2025.12/input_example"
  YOMITOKU_TEST_OUTPUT_DIR: "/Users/mmorinag/Sawa/2025.12/yomitoku-test/results"
  YOMITOKU_TEST_CONFIG: "/Users/mmorinag/Sawa/2025.12/yomitoku-test/yomitoku_config.json"
  YOMITOKU_TEST_DPI: "200,300,400"
  YOMITOKU_TEST_DEVICE: "cpu"
  PROD_WEB_URL: "https://web-prod-avlnzjjrca-dt.a.run.app"
  PROD_WORKER_URL: "https://worker-prod-avlnzjjrca-dt.a.run.app"
  STG_PROJECT_ID: "sawahospitalsystem"
  STG_REGION: "asia-northeast2"
  STG_WEB_SERVICE: "web-stg"
  STG_WORKER_SERVICE: "worker-stg"
  STG_TERRAFORM_DIR: "infra/terraform/envs/stg"
  WORKTREE_ROOT: "/Users/mmorinag/Sawa/2025.12/worktrees"

tasks:
  backend_setup:
    desc: Create venv and install backend dependencies.
    cmds:
      - 'python3.11 -m venv backend/.venv'
      - 'backend/.venv/bin/pip install -U pip setuptools wheel'
      - 'backend/.venv/bin/pip install -r backend/requirements.txt'

  backend_setup_dev:
    desc: Install backend dev/test dependencies.
    deps:
      - backend_setup
    cmds:
      - 'backend/.venv/bin/pip install -e backend[dev] --no-build-isolation'

  backend_clean_venv:
    desc: Remove backend venv (use before recreating).
    cmds:
      - 'rm -rf backend/.venv'

  backend_run:
    desc: Run FastAPI backend with local env vars.
    dir: backend
    env:
      GOOGLE_APPLICATION_CREDENTIALS: "{{.GCP_SA_KEY}}"
      GCP_PROJECT_ID: "{{.PROJECT_ID}}"
      FACILITY_MASTER_PATH: "src/data/facility_master.test.json"
      OCR_DEBUG_DUMP_DIR: "tmp"
      DB_URI: "{{.LOCAL_DB_URI}}"
    cmds:
      - './.venv/bin/uvicorn src.main:app --reload'

  backend_start:
    desc: Setup backend venv and run the API.
    deps:
      - backend_setup
    cmds:
      - task: backend_run

  ocr_test:
    desc: Upload a test PDF to local ingest endpoint.
    env:
      FAX_PDF: "{{.FAX_PDF}}"
    cmds:
      - |
        curl -X POST http://localhost:8000/ingest/upload \
          -F "pdf_file=@{{.FAX_PDF}};type=application/pdf" \
          -F "received_at=2025-12-28T10:00:00"

  ocr_test_cloud:
    desc: Send OCR ingest request via Pub/Sub + GCS (Cloud Run path).
    env:
      PROJECT_ID: "{{.PROJECT_ID}}"
      TOPIC: "orders-dev"
      RAW_BUCKET: "{{.PROJECT_ID}}-dev-raw"
      PDF_PATH: "{{.FAX_PDF}}"
    cmds:
      - 'bash infra/terraform/tests/push_ingest.sh'

  ocr_pipeline_trigger:
    desc: Upload PDF to OCR pipeline bucket and optionally trigger pipeline endpoint.
    env:
      OCR_PIPELINE_BUCKET: "{{.PROJECT_ID}}-dev-raw"
      OCR_PIPELINE_INPUT_PREFIX: "input/"
      OCR_PIPELINE_URL: ""
      OCR_PIPELINE_FACILITY_ID: "FAC00002"
      OCR_PIPELINE_TEMPLATE_ID: "fax_fac00002_v1"
      OCR_PIPELINE_PDF: "{{.FAX_PDF}}"
    cmds:
      - |
        object_name="${OCR_PIPELINE_INPUT_PREFIX}yomitoku-$(date +%Y%m%d_%H%M%S).pdf"
        gsutil -h "x-goog-meta-facility_id:${OCR_PIPELINE_FACILITY_ID}" \
          -h "x-goog-meta-template_id:${OCR_PIPELINE_TEMPLATE_ID}" \
          cp "${OCR_PIPELINE_PDF}" "gs://${OCR_PIPELINE_BUCKET}/${object_name}"
        if [ -n "${OCR_PIPELINE_URL}" ]; then
          curl -sS -X POST "${OCR_PIPELINE_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"bucket\":\"${OCR_PIPELINE_BUCKET}\",\"name\":\"${object_name}\"}"
        else
          echo "uploaded: gs://${OCR_PIPELINE_BUCKET}/${object_name}"
        fi

  yomitoku_setup:
    desc: Create venv and install yomitoku test dependencies.
    cmds:
      - 'python3.11 -m venv yomitoku-test/.venv'
      - 'yomitoku-test/.venv/bin/pip install -U pip setuptools wheel'
      - 'yomitoku-test/.venv/bin/pip install -r ocr_pipeline/requirements.txt'

  yomitoku_run:
    desc: Run yomitoku batch OCR on input_example PDFs with multiple DPI.
    deps:
      - yomitoku_setup
    cmds:
      - >-
        yomitoku-test/.venv/bin/python
        yomitoku-test/run_yomitoku_batch.py
        --input-dir "{{.YOMITOKU_TEST_INPUT_DIR}}"
        --output-dir "{{.YOMITOKU_TEST_OUTPUT_DIR}}"
        --config "{{.YOMITOKU_TEST_CONFIG}}"
        --dpi "{{.YOMITOKU_TEST_DPI}}"
        --device "{{.YOMITOKU_TEST_DEVICE}}"
        --vis-pdf

  backend_test_us1:
    desc: Run US1 contract/integration tests for ingest + supersede + facility unresolved.
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - './.venv/bin/python -m pytest tests/contract/test_ingest.py tests/integration/test_ingest_supersede.py tests/integration/test_facility_unresolved.py'

  backend_test_us2:
    desc: Run US2 integration tests for line corrections + status flow.
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - './.venv/bin/python -m pytest tests/integration/test_line_corrections.py tests/integration/test_status_flow.py'

  backend_test_us3:
    desc: Run US3 integration tests for menu upload/edit/override.
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - './.venv/bin/python -m pytest tests/integration/test_menu_upload.py tests/integration/test_menu_edits_output.py tests/integration/test_menu_override.py'

  backend_test_us4:
    desc: Run US4 contract/integration tests for facility config.
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - './.venv/bin/python -m pytest tests/contract/test_facility_config.py tests/integration/test_facility_config_apply.py'

  backend_test_us_all:
    desc: Run US1-4 targeted test suites.
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - >-
        ./.venv/bin/python -m pytest
        tests/contract/test_ingest.py
        tests/integration/test_ingest_supersede.py
        tests/integration/test_facility_unresolved.py
        tests/integration/test_line_corrections.py
        tests/integration/test_status_flow.py
        tests/integration/test_menu_upload.py
        tests/integration/test_menu_edits_output.py
        tests/integration/test_menu_override.py
        tests/contract/test_facility_config.py
        tests/integration/test_facility_config_apply.py

  backend_test:
    desc: Run all backend tests.
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - './.venv/bin/python -m pytest tests'

  db_backfill_facility_template_versions:
    desc: Backfill facility template version lineage for existing orders/artifacts. Pass DRY_RUN=1 to inspect only.
    cmds:
      - >-
        backfill_args="";
        if [ "${DRY_RUN:-0}" = "1" ]; then backfill_args="--dry-run"; fi;
        backend/.venv/bin/python scripts/backfill_facility_template_version_lineage.py ${backfill_args}

  backend_test_regression_sheet:
    desc: Run OCR sheet regression tests (template validation + known order fixture).
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - >-
        ./.venv/bin/python -m pytest
        tests/integration/test_config_validator.py
        tests/integration/test_ocr_sheet_history.py
        tests/integration/test_ocr_sheet_corpus_regression.py
        tests/contract/test_orders_ocr_sheet_history_api.py

  backend_test_regression_ocr_quality:
    desc: Run OCR quality gate regression tests (reparse/quality/status contract).
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - >-
        ./.venv/bin/python -m pytest
        tests/integration/test_ocr_pipeline.py
        tests/integration/test_ocr_sheet_history.py
        tests/integration/test_ocr_sheet_corpus_regression.py
        tests/integration/test_ocr_quality_service.py
        tests/contract/test_orders_ocr_sheet_history_api.py
        tests/contract/test_orders_ocr_status_api.py
        tests/contract/test_system_admin_api.py

  ocr_reparse_failure_report:
    desc: Export OCR reparse failure pattern summary (provider/error grouped).
    dir: backend
    deps:
      - backend_setup_dev
    cmds:
      - './.venv/bin/python scripts/export_ocr_reparse_failures.py --limit 200 --hours 168 --format markdown'

  pubsub_ingest_test:
    desc: Publish an ingest payload to Pub/Sub and upload the PDF to GCS.
    env:
      PROJECT_ID: "{{.PROJECT_ID}}"
      TOPIC: "orders-dev"
      RAW_BUCKET: "{{.PROJECT_ID}}-dev-raw"
      PDF_PATH: "{{.FAX_PDF}}"
    cmds:
      - 'bash infra/terraform/tests/push_ingest.sh'

  frontend_setup:
    desc: Install frontend dependencies.
    dir: frontend
    cmds:
      - 'npm install'

  frontend_test_e2e:
    desc: Run Playwright E2E tests (requires browsers installed).
    dir: frontend
    deps:
      - frontend_setup
    cmds:
      - 'npx playwright install'
      - 'npm run test:e2e'

  cloudrun_web_public_on:
    desc: Allow unauthenticated invocations for Cloud Run web (test only).
    env:
      PROJECT_ID: "{{.PROJECT_ID}}"
      CLOUDRUN_REGION: "{{.CLOUDRUN_REGION}}"
      CLOUDRUN_WEB_SERVICE: "{{.CLOUDRUN_WEB_SERVICE}}"
    cmds:
      - >
        gcloud run services add-iam-policy-binding {{.CLOUDRUN_WEB_SERVICE}}
        --region={{.CLOUDRUN_REGION}}
        --project={{.PROJECT_ID}}
        --member=allUsers
        --role=roles/run.invoker

  cloudrun_web_public_off:
    desc: Revoke unauthenticated invocations for Cloud Run web.
    env:
      PROJECT_ID: "{{.PROJECT_ID}}"
      CLOUDRUN_REGION: "{{.CLOUDRUN_REGION}}"
      CLOUDRUN_WEB_SERVICE: "{{.CLOUDRUN_WEB_SERVICE}}"
    cmds:
      - >
        gcloud run services remove-iam-policy-binding {{.CLOUDRUN_WEB_SERVICE}}
        --region={{.CLOUDRUN_REGION}}
        --project={{.PROJECT_ID}}
        --member=allUsers
        --role=roles/run.invoker

  frontend_run_cloudrun_proxy:
    desc: Run frontend dev server with API proxy to Cloud Run (CORS-safe).
    dir: frontend
    env:
      API_PROXY_TARGET: "{{.CLOUDRUN_WEB_URL}}"
      NEXT_PUBLIC_API_BASE_URL: "/api"
    cmds:
      - 'npm run dev -- --hostname 127.0.0.1 --port 3100'

  frontend_run_local:
    desc: Run frontend dev server against local backend (http://127.0.0.1:8000).
    dir: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000"
    cmds:
      - 'npm run dev -- --hostname 127.0.0.1 --port 3100'

  predeploy_prod_checks:
    desc: Run production readiness checks (web/worker endpoints + Gmail/OAuth + OCR quality gate).
    env:
      WEB_URL: "{{.PROD_WEB_URL}}"
      WORKER_URL: "{{.PROD_WORKER_URL}}"
    cmds:
      - 'WEB_URL="{{.PROD_WEB_URL}}" WORKER_URL="{{.PROD_WORKER_URL}}" OPERATOR_USER="${OPERATOR_USER}" OPERATOR_PASSWORD="${OPERATOR_PASSWORD}" STRICT_OCR_QUALITY="1" ./scripts/predeploy_env_checks.sh'

  predeploy_stg_checks:
    desc: Run staging readiness checks (non-strict OCR quality by default).
    env:
      WEB_SERVICE: "{{.STG_WEB_SERVICE}}"
      WORKER_SERVICE: "{{.STG_WORKER_SERVICE}}"
    cmds:
      - 'PROJECT_ID="{{.STG_PROJECT_ID}}" REGION="{{.STG_REGION}}" WEB_SERVICE="{{.STG_WEB_SERVICE}}" WORKER_SERVICE="{{.STG_WORKER_SERVICE}}" OPERATOR_USER="${OPERATOR_USER}" OPERATOR_PASSWORD="${OPERATOR_PASSWORD}" STRICT_OCR_QUALITY="${STRICT_OCR_QUALITY:-0}" CHECK_WEB_PROXY="${CHECK_WEB_PROXY:-1}" ALLOW_BASIC_ONLY_AUTH="1" ./scripts/predeploy_env_checks.sh'

  prepare_prod_web_source:
    desc: Create a fresh clean deploy copy for web-prod and record its path.
    cmds:
      - >-
        deploy_dir="$(WEB_DEPLOY_LABEL="${WEB_DEPLOY_LABEL:-prod-web}" ./scripts/prepare_web_deploy_source.sh "${WEB_DEPLOY_LABEL:-prod-web}")";
        echo "$deploy_dir" | tee last_frontend_deploy_dir.txt

  prepare_stg_web_source:
    desc: Create a fresh clean deploy copy for web-stg and record its path.
    cmds:
      - >-
        deploy_dir="$(WEB_DEPLOY_LABEL="${WEB_DEPLOY_LABEL:-stg-web}" ./scripts/prepare_web_deploy_source.sh "${WEB_DEPLOY_LABEL:-stg-web}")";
        echo "$deploy_dir" | tee last_frontend_deploy_dir.txt

  deploy_prod_web:
    desc: Build and deploy web-prod only if predeploy checks pass; accepts optional ORDER_ID for exact-order current-state parity smoke.
    env:
      WEB_URL: "{{.PROD_WEB_URL}}"
      WORKER_URL: "{{.PROD_WORKER_URL}}"
    cmds:
      - >-
        deploy_dir="$(WEB_DEPLOY_LABEL="${WEB_DEPLOY_LABEL:-prod-web}" ./scripts/prepare_web_deploy_source.sh "${WEB_DEPLOY_LABEL:-prod-web}")";
        echo "$deploy_dir" > last_frontend_deploy_dir.txt;
        WEB_URL="{{.PROD_WEB_URL}}" WORKER_URL="{{.PROD_WORKER_URL}}"
        FRONTEND_DIR="$deploy_dir"
        WEB_DEPLOY_LABEL="${WEB_DEPLOY_LABEL:-prod-web}"
        ORDER_ID="${ORDER_ID:-}"
        OPERATOR_USER="${OPERATOR_USER}" OPERATOR_PASSWORD="${OPERATOR_PASSWORD}"
        STRICT_OCR_QUALITY="1"
        ./scripts/deploy_prod_web.sh

  deploy_stg_web:
    desc: Build and deploy web-stg using the generic env-aware web deploy script; accepts optional ORDER_ID for exact-order parity smoke.
    env:
      WEB_SERVICE: "{{.STG_WEB_SERVICE}}"
      WORKER_SERVICE: "{{.STG_WORKER_SERVICE}}"
    cmds:
      - >-
        deploy_dir="$(WEB_DEPLOY_LABEL="${WEB_DEPLOY_LABEL:-stg-web}" ./scripts/prepare_web_deploy_source.sh "${WEB_DEPLOY_LABEL:-stg-web}")";
        echo "$deploy_dir" > last_frontend_deploy_dir.txt;
        PROJECT_ID="{{.STG_PROJECT_ID}}" REGION="{{.STG_REGION}}"
        WEB_SERVICE="{{.STG_WEB_SERVICE}}" WORKER_SERVICE="{{.STG_WORKER_SERVICE}}"
        FRONTEND_DIR="$deploy_dir"
        WEB_DEPLOY_LABEL="${WEB_DEPLOY_LABEL:-stg-web}"
        ORDER_ID="${ORDER_ID:-}"
        OPERATOR_USER="${OPERATOR_USER}" OPERATOR_PASSWORD="${OPERATOR_PASSWORD}"
        STRICT_OCR_QUALITY="${STRICT_OCR_QUALITY:-0}"
        WORKFLOW_V2_DEPLOY_CHECK="1"
        ALLOW_BASIC_ONLY_AUTH="1"
        TAG_PREFIX="stg-frontend"
        ./scripts/deploy_web_with_checks.sh

  build_stg_backend:
    desc: Build the staging backend image from a fresh deploy source and write last_backend_image.txt.
    cmds:
      - >-
        deploy_dir="$(./scripts/prepare_hakodate_backend_deploy_source.sh stg-backend)";
        tag="stg-backend-$(date +%Y%m%d-%H%M%S)";
        image="asia-northeast2-docker.pkg.dev/{{.STG_PROJECT_ID}}/backend/backend:${tag}";
        build_config="$(mktemp)";
        printf "%s\n" "steps:" > "$build_config";
        printf "%s\n" "  - name: 'gcr.io/cloud-builders/docker'" >> "$build_config";
        printf "%s\n" "    args: ['build', '-t', '${image}', '.']" >> "$build_config";
        printf "%s\n" "images: ['${image}']" >> "$build_config";
        gcloud builds submit "$deploy_dir" --project="{{.STG_PROJECT_ID}}" --config="$build_config";
        echo "$image" | tee last_backend_image.txt

  deploy_prod_worker:
    desc: Deploy worker-prod with mandatory regression, OCR sheet quality, and exact-order Step2 parity gates.
    env:
      WEB_URL: "{{.PROD_WEB_URL}}"
    cmds:
      - >-
        image="${IMAGE:-$(cat last_backend_image.txt)}";
        if [ -z "${ORDER_ID:-}" ]; then
          echo "ORDER_ID is required. example: ORDER_ID=ORDb266d5d9 task deploy_prod_worker";
          exit 1;
        fi;
        OPERATOR_USER="${OPERATOR_USER}" OPERATOR_PASSWORD="${OPERATOR_PASSWORD}"
        WEB_URL="{{.PROD_WEB_URL}}"
        ./scripts/deploy_worker_prod_with_checks.sh "$image" "${ORDER_ID}"

  deploy_stg_worker:
    desc: Deploy worker-stg with local regression and non-strict staging gates by default.
    env:
      WEB_SERVICE: "{{.STG_WEB_SERVICE}}"
    cmds:
      - >-
        image="${IMAGE:-$(cat last_backend_image.txt)}";
        if [ -z "${ORDER_ID:-}" ]; then
          echo "ORDER_ID is required. example: ORDER_ID=ORDb266d5d9 task deploy_stg_worker";
          exit 1;
        fi;
        PROJECT_ID="{{.STG_PROJECT_ID}}" REGION="{{.STG_REGION}}"
        SERVICE="{{.STG_WORKER_SERVICE}}"
        WEB_SERVICE="{{.STG_WEB_SERVICE}}"
        OPERATOR_USER="${OPERATOR_USER}" OPERATOR_PASSWORD="${OPERATOR_PASSWORD}"
        RUN_LOCAL_REGRESSION="0"
        STRICT_OCR_SHEET_GATE="${STRICT_OCR_SHEET_GATE:-0}"
        STRICT_OCR_QUALITY="${STRICT_OCR_QUALITY:-0}"
        CHECK_WEB_PROXY="${CHECK_WEB_PROXY:-1}"
        WORKFLOW_V2_DEPLOY_CHECK="1"
        ALLOW_BASIC_ONLY_AUTH="1"
        ./scripts/deploy_worker_prod_with_checks.sh "$image" "${ORDER_ID}"

  infra_stg_init:
    desc: Init stg Terraform with backend.hcl and either credentials file or gcloud access token.
    dir: "{{.STG_TERRAFORM_DIR}}"
    cmds:
      - >-
        if [ ! -f backend.hcl ]; then
          echo "Missing infra/terraform/envs/stg/backend.hcl. Copy backend.hcl.example first.";
          exit 1;
        fi;
        creds="${TF_GOOGLE_CREDENTIALS:-${GOOGLE_APPLICATION_CREDENTIALS:-}}";
        if [ -n "$creds" ]; then
          GOOGLE_APPLICATION_CREDENTIALS="$creds" \
          GOOGLE_CLOUD_QUOTA_PROJECT="{{.STG_PROJECT_ID}}" \
          CLOUDSDK_CORE_PROJECT="{{.STG_PROJECT_ID}}" \
          tofu init -backend-config=backend.hcl -input=false;
        else
          token="$(gcloud auth print-access-token)";
          GOOGLE_OAUTH_ACCESS_TOKEN="$token" \
          GOOGLE_CLOUD_QUOTA_PROJECT="{{.STG_PROJECT_ID}}" \
          CLOUDSDK_CORE_PROJECT="{{.STG_PROJECT_ID}}" \
          tofu init -backend-config=backend.hcl -input=false;
        fi

  infra_stg_plan:
    desc: Plan stg Terraform with the current tfvars.
    dir: "{{.STG_TERRAFORM_DIR}}"
    deps:
      - infra_stg_init
    cmds:
      - >-
        creds="${TF_GOOGLE_CREDENTIALS:-${GOOGLE_APPLICATION_CREDENTIALS:-}}";
        if [ -n "$creds" ]; then
          GOOGLE_APPLICATION_CREDENTIALS="$creds" \
          GOOGLE_CLOUD_QUOTA_PROJECT="{{.STG_PROJECT_ID}}" \
          CLOUDSDK_CORE_PROJECT="{{.STG_PROJECT_ID}}" \
          tofu plan -input=false -lock=false -no-color -var-file=terraform.tfvars;
        else
          token="$(gcloud auth print-access-token)";
          GOOGLE_OAUTH_ACCESS_TOKEN="$token" \
          GOOGLE_CLOUD_QUOTA_PROJECT="{{.STG_PROJECT_ID}}" \
          CLOUDSDK_CORE_PROJECT="{{.STG_PROJECT_ID}}" \
          tofu plan -input=false -lock=false -no-color -var-file=terraform.tfvars;
        fi

  infra_stg_apply:
    desc: Apply stg Terraform with the current tfvars.
    dir: "{{.STG_TERRAFORM_DIR}}"
    deps:
      - infra_stg_init
    cmds:
      - >-
        creds="${TF_GOOGLE_CREDENTIALS:-${GOOGLE_APPLICATION_CREDENTIALS:-}}";
        if [ -n "$creds" ]; then
          GOOGLE_APPLICATION_CREDENTIALS="$creds" \
          GOOGLE_CLOUD_QUOTA_PROJECT="{{.STG_PROJECT_ID}}" \
          CLOUDSDK_CORE_PROJECT="{{.STG_PROJECT_ID}}" \
          tofu apply -input=false -auto-approve -var-file=terraform.tfvars;
        else
          token="$(gcloud auth print-access-token)";
          GOOGLE_OAUTH_ACCESS_TOKEN="$token" \
          GOOGLE_CLOUD_QUOTA_PROJECT="{{.STG_PROJECT_ID}}" \
          CLOUDSDK_CORE_PROJECT="{{.STG_PROJECT_ID}}" \
          tofu apply -input=false -auto-approve -var-file=terraform.tfvars;
        fi

  worktree_add_feature:
    desc: Create a dedicated feature worktree. Example FEATURE=shipping-history-grid task worktree_add_feature
    cmds:
      - >-
        if [ -z "${FEATURE:-}" ]; then
          echo "FEATURE is required. example: FEATURE=shipping-history-grid task worktree_add_feature";
          exit 1;
        fi;
        WORKTREE_ROOT="{{.WORKTREE_ROOT}}"
        BRANCH_PREFIX="${BRANCH_PREFIX:-codex}"
        BASE_REF="${BASE_REF:-$(git rev-parse --abbrev-ref HEAD)}"
        ./scripts/create_feature_worktree.sh "${FEATURE}"

  git_flow_bootstrap:
    desc: Create standard Git Flow branches if missing. Uses master/develop and optionally release/prod-YYYYMMDD.
    cmds:
      - >-
        PROD_BRANCH="{{if .PROD_BRANCH}}{{.PROD_BRANCH}}{{else}}master{{end}}"
        DEVELOP_BRANCH="{{if .DEVELOP_BRANCH}}{{.DEVELOP_BRANCH}}{{else}}develop{{end}}"
        RELEASE_DATE="{{if .RELEASE_DATE}}{{.RELEASE_DATE}}{{else}}{{now | date "20060102"}}{{end}}"
        CREATE_RELEASE_BRANCH="{{if .CREATE_RELEASE_BRANCH}}{{.CREATE_RELEASE_BRANCH}}{{else}}0{{end}}"
        ./scripts/git_flow_bootstrap_branches.sh

  git_flow_status:
    desc: Show release-source status for Git Flow operations without requiring a pass.
    cmds:
      - >-
        STRICT="{{if .STRICT}}{{.STRICT}}{{else}}0{{end}}"
        TARGET_ENV="{{if .TARGET_ENV}}{{.TARGET_ENV}}{{else}}prod{{end}}"
        RELEASE_BRANCH="{{if .RELEASE_BRANCH}}{{.RELEASE_BRANCH}}{{end}}"
        ./scripts/git_flow_release_preflight.sh

  prod_release_prepare:
    desc: Create release/prod-YYYYMMDD from develop after stg validation.
    cmds:
      - >-
        PROD_BRANCH="{{if .PROD_BRANCH}}{{.PROD_BRANCH}}{{else}}master{{end}}"
        DEVELOP_BRANCH="{{if .DEVELOP_BRANCH}}{{.DEVELOP_BRANCH}}{{else}}develop{{end}}"
        RELEASE_DATE="{{if .RELEASE_DATE}}{{.RELEASE_DATE}}{{else}}{{now | date "20060102"}}{{end}}"
        ./scripts/git_flow_prepare_prod_release.sh

  prod_release_worktree:
    desc: Create a dedicated worktree for release/prod-YYYYMMDD.
    cmds:
      - >-
        RELEASE_DATE="{{if .RELEASE_DATE}}{{.RELEASE_DATE}}{{else}}{{now | date "20060102"}}{{end}}"
        WORKTREE_ROOT="{{.WORKTREE_ROOT}}"
        ./scripts/git_flow_add_release_worktree.sh

  prod_release_preflight:
    desc: Strict Git Flow prod release-source preflight before any prod deploy.
    cmds:
      - >-
        STRICT="1"
        TARGET_ENV="prod"
        PROD_BRANCH="{{if .PROD_BRANCH}}{{.PROD_BRANCH}}{{else}}master{{end}}"
        DEVELOP_BRANCH="{{if .DEVELOP_BRANCH}}{{.DEVELOP_BRANCH}}{{else}}develop{{end}}"
        RELEASE_BRANCH="{{if .RELEASE_BRANCH}}{{.RELEASE_BRANCH}}{{else}}release/prod-{{now | date "20060102"}}{{end}}"
        ./scripts/git_flow_release_preflight.sh

  ops_script_check:
    desc: Syntax-check release/worktree helper scripts.
    cmds:
      - 'bash -n ./scripts/create_feature_worktree.sh'
      - 'bash -n ./scripts/test_create_feature_worktree.sh'
      - 'bash -n ./scripts/git_flow_add_release_worktree.sh'
      - 'bash -n ./scripts/git_flow_bootstrap_branches.sh'
      - 'bash -n ./scripts/git_flow_prepare_prod_release.sh'
      - 'bash -n ./scripts/git_flow_release_preflight.sh'
      - 'bash -n ./scripts/predeploy_env_checks.sh'
      - 'bash -n ./scripts/predeploy_prod_checks.sh'
      - 'bash -n ./scripts/deploy_web_with_checks.sh'
      - 'bash -n ./scripts/deploy_prod_web.sh'
      - 'bash -n ./scripts/deploy_worker_prod_with_checks.sh'

  ops_script_test:
    desc: Run lightweight script tests for workflow helpers.
    cmds:
      - './scripts/test_create_feature_worktree.sh'
