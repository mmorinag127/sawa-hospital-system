[project]
name = "hospital-order-backend"
version = "0.0.1"
description = "Backend API and workers for hospital order system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=5.5.0",
    "Pillow>=12.1.1",
    "PyMuPDF>=1.24.14",
    "pandas>=2.1.0",
    "numpy>=2.4.2",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.0",
    "google-cloud-storage>=2.16.0",
    "google-auth>=2.0.0",
    "google-cloud-firestore>=2.17.0",
    "opencv-python-headless>=4.9.0.80",
    "pyyaml>=6.0.1",
    "idna>=3.15",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pygments>=2.20.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
