[project]
name = "hospital-order-backend"
version = "0.0.1"
description = "Backend API and workers for hospital order system"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "cryptography==50.0.2",
    "starlette==1.3.1",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=5.5.0",
    "Pillow==13.0.0",
    "PyMuPDF>=1.24.14",
    "pandas>=2.1.0",
    "numpy>=2.4.2",
    "openpyxl>=3.1.0",
    "anyio>=4.14.2,<5",
    "Mako>=1.3.12,<2",
    "pyasn1>=0.6.4,<0.7",
    "python-dotenv>=1.2.2,<2",
    "python-multipart>=0.0.31,<0.1",
    "loguru>=0.7.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-tasks>=2.16.0,<3.0.0",
    "grpcio==1.80.0",
    "grpcio-status==1.80.0",
    "google-auth>=2.0.0",
    "google-cloud-firestore>=2.17.0",
    "markdown-it-py==4.2.0",
    "opencv-python-headless==5.0.0.93",
    "pyyaml>=6.0.1",
    "idna>=3.15",
    "requests>=2.33.0",
    "urllib3>=2.8.0,<3",
]

[project.optional-dependencies]
dev = [
    "setuptools>=83.0.0",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pygments>=2.20.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
