      qty_regex: '^\\d{0,2}$'
      normalize_fullwidth: true
      reject_repetition:
        max_repeat_run: 3
        min_unique_line_ratio: 0.3
      retry:
        max_attempts: 2
        crop_inset_px: [6, 6, 6, 6]
        alt_binarize: true
    table_box: [0.05, 0.20, 0.95, 0.90]
    header_rows: 0
    normalize_whitespace: true
    fill_forward_roles: ["date"]
    fill_missing_date_with_first_seen: true
    grid_expected_columns: 9
    grid_table_box: [0.05, 0.20, 0.95, 0.90]
    main_ocr_use_table_box: true
    main_ocr_resolution: 400
    main_ocr_body_box: [0.05, 0.26, 0.95, 0.90]
    main_ocr_provider: pipeline
    main_ocr_row_fields:
