    token_ocr_resolution: 320
    token_ocr_ink_threshold: 200
    token_ocr_ink_ratio: 0.01
    auto_header_band: [0.18, 0.30]
    auto_headers:
      - index: 0
        role: date
        format: MM/DD
        match_groups: [["日付", "日付け", "日付/"]]
      - index: 1
        role: menu_name
        match_groups: [["献立", "献立名", "メニュー", "メニュー名", "品名", "料理名", "料理"]]
      - index: 2
        role: quantity
        diet_type: regular
        area_id: 2F
