name: Verify Live Label Display

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [stg, prod]
        required: true
      order_id:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      ORDER_ID: ${{ inputs.order_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        id: auth-stg
        if: inputs.target == 'stg'
        with:
          project_id: sawahospitalsystem
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STG }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_STG }}
          token_format: id_token
          id_token_audience: ${{ vars.STG_GOOGLE_OAUTH_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/auth@v3
        id: auth-prod
        if: inputs.target == 'prod'
        with:
          project_id: sawahospitalsystem
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: '167795504375-hu5316gut0ke8vruc857qsb524q4kq50.apps.googleusercontent.com'
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Record serving revisions
        run: |
          set -euo pipefail
          mkdir -p verification
          for service in "web-$TARGET" "worker-$TARGET"; do
            gcloud run services describe "$service" --project=sawahospitalsystem --region=asia-northeast2 \
              --format='json(status.latestReadyRevisionName,status.traffic,spec.template.spec.containers[0].image)' > "verification/$service.json"
          done
      - name: Download and inspect live label CSV
        env:
          STG_TOKEN: ${{ steps.auth-stg.outputs.id_token }}
          PROD_TOKEN: ${{ steps.auth-prod.outputs.id_token }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            stg) export VERIFICATION_TOKEN="$STG_TOKEN" ;;
            prod) export VERIFICATION_TOKEN="$PROD_TOKEN" ;;
            *) exit 1 ;;
          esac
          test -n "$VERIFICATION_TOKEN"
          python3 scripts/verify_live_breakfast_labels.py --target "$TARGET" --order-id "$ORDER_ID" --output-dir verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-label-display-${{ inputs.target }}
          path: verification/
          retention-days: 7
