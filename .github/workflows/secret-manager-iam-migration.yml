name: Secret Manager IAM Migration

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - stg
          - prod
      phase:
        description: "Migration phase"
        required: true
        type: choice
        options:
          - phase1
          - phase2
      mode:
        description: "Run mode"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      phase1_record_path:
        description: "Required for phase2: tracked JSON record path"
        required: false
        default: ""

concurrency:
  group: secret-manager-iam-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.5.7"

jobs:
  source-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      env_dir: ${{ steps.contract.outputs.env_dir }}
      github_environment: ${{ steps.contract.outputs.github_environment }}
      retain_legacy_project_secret_accessor: ${{ steps.contract.outputs.retain_legacy_project_secret_accessor }}
      artifact_name: ${{ steps.contract.outputs.artifact_name }}
      phase1_record_path: ${{ steps.contract.outputs.phase1_record_path }}
      phase1_apply_run_id: ${{ steps.contract.outputs.phase1_apply_run_id }}
      phase1_apply_head_sha: ${{ steps.contract.outputs.phase1_apply_head_sha }}
      phase1_plan_sha256: ${{ steps.contract.outputs.phase1_plan_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Assert exact source branch
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          if [[ "${{ inputs.target_environment }}" = "prod" ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")"
            git merge-base --is-ancestor origin/develop HEAD
          else
            test "${GITHUB_REF_NAME}" = "develop"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          fi
      - id: contract
        name: Validate dispatch contract
        run: |
          set -euo pipefail
          python infra/terraform/scripts/secret_manager_iam_migration.py validate-dispatch \
            --environment "${{ inputs.target_environment }}" \
            --phase "${{ inputs.phase }}" \
            --branch "${GITHUB_REF_NAME}" \
            --phase1-record-path "${{ inputs.phase1_record_path }}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --github-output "${GITHUB_OUTPUT}" \
            --contract-json "${RUNNER_TEMP}/secret-manager-iam-contract.json"

  phase1-run-gate:
    needs:
      - source-gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.phase == 'phase2' }}
      - name: Verify recorded phase1 GitHub Actions run
        if: ${{ inputs.phase == 'phase2' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${{ needs.source-gate.outputs.phase1_apply_run_id }}" \
            > "${RUNNER_TEMP}/phase1-run.json"
          python infra/terraform/scripts/secret_manager_iam_migration.py validate-phase1-run \
            --environment "${{ inputs.target_environment }}" \
            --phase1-record-path "${{ needs.source-gate.outputs.phase1_record_path }}" \
            --run-json "${RUNNER_TEMP}/phase1-run.json" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --summary-json "${RUNNER_TEMP}/phase1-run-summary.json"

  plan:
    needs:
      - source-gate
      - phase1-run-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ needs.source-gate.outputs.github_environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Materialize backend.hcl, tfvars, and phase override
        env:
          TF_ENV_DIR: ${{ needs.source-gate.outputs.env_dir }}
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TF_TFVARS: ${{ secrets.TF_TFVARS }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${TF_ENV_DIR}/backend.hcl"
          printf '%s\n' "${TF_BACKEND_HCL}" > "${TF_ENV_DIR}/backend.hcl"
          install -m 600 /dev/null "${TF_ENV_DIR}/terraform.tfvars"
          printf '%s\n' "${TF_TFVARS}" > "${TF_ENV_DIR}/terraform.tfvars"
          python infra/terraform/scripts/secret_manager_iam_migration.py write-override \
            --output "${TF_ENV_DIR}/zz_secret_manager_iam_migration.auto.tfvars.json" \
            --retain-legacy "${{ needs.source-gate.outputs.retain_legacy_project_secret_accessor }}"
      - name: Terraform init
        working-directory: ${{ needs.source-gate.outputs.env_dir }}
        run: terraform init -backend-config=backend.hcl -input=false
      - name: Terraform plan
        working-directory: ${{ needs.source-gate.outputs.env_dir }}
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -lock=false \
            -no-color \
            -out="${RUNNER_TEMP}/secret-manager-iam.tfplan"
          terraform show -no-color "${RUNNER_TEMP}/secret-manager-iam.tfplan" > "${RUNNER_TEMP}/secret-manager-iam.txt"
          terraform show -json "${RUNNER_TEMP}/secret-manager-iam.tfplan" > "${RUNNER_TEMP}/secret-manager-iam.json"
      - name: Validate migration allowlist
        run: |
          set -euo pipefail
          python infra/terraform/scripts/secret_manager_iam_migration.py validate-plan \
            --phase "${{ inputs.phase }}" \
            --plan-json "${RUNNER_TEMP}/secret-manager-iam.json" \
            --summary-json "${RUNNER_TEMP}/secret-manager-iam-summary.json"
      - name: Hash plan artifact
        run: sha256sum "${RUNNER_TEMP}/secret-manager-iam.tfplan" > "${RUNNER_TEMP}/secret-manager-iam.tfplan.sha256"
      - name: Summarize plan
        run: |
          set -euo pipefail
          plan_sha="$(cut -d' ' -f1 "${RUNNER_TEMP}/secret-manager-iam.tfplan.sha256")"
          total_changes="$(jq -r '.total_allowed_changes' "${RUNNER_TEMP}/secret-manager-iam-summary.json")"
          phase1_record="${{ needs.source-gate.outputs.phase1_record_path }}"
          if [[ -z "${phase1_record}" ]]; then
            phase1_record="not required"
          fi
          {
            echo "## Secret Manager IAM migration plan"
            echo ""
            echo "- Environment: \`${{ inputs.target_environment }}\`"
            echo "- Phase: \`${{ inputs.phase }}\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- retain_legacy_project_secret_accessor: \`${{ needs.source-gate.outputs.retain_legacy_project_secret_accessor }}\`"
            echo "- Phase1 record: \`${phase1_record}\`"
            echo "- Plan SHA256: \`${plan_sha}\`"
            echo "- Allowed resource changes: \`${total_changes}\`"
            echo ""
            echo "Review the uploaded artifact for the full binary plan, text plan, JSON plan, and checksum before approving apply."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.source-gate.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/secret-manager-iam.tfplan
            ${{ runner.temp }}/secret-manager-iam.tfplan.sha256
            ${{ runner.temp }}/secret-manager-iam.txt
            ${{ runner.temp }}/secret-manager-iam.json
            ${{ runner.temp }}/secret-manager-iam-summary.json

  apply:
    if: ${{ inputs.mode == 'apply' }}
    needs:
      - source-gate
      - plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ needs.source-gate.outputs.github_environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Materialize backend.hcl, tfvars, and phase override
        env:
          TF_ENV_DIR: ${{ needs.source-gate.outputs.env_dir }}
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TF_TFVARS: ${{ secrets.TF_TFVARS }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${TF_ENV_DIR}/backend.hcl"
          printf '%s\n' "${TF_BACKEND_HCL}" > "${TF_ENV_DIR}/backend.hcl"
          install -m 600 /dev/null "${TF_ENV_DIR}/terraform.tfvars"
          printf '%s\n' "${TF_TFVARS}" > "${TF_ENV_DIR}/terraform.tfvars"
          python infra/terraform/scripts/secret_manager_iam_migration.py write-override \
            --output "${TF_ENV_DIR}/zz_secret_manager_iam_migration.auto.tfvars.json" \
            --retain-legacy "${{ needs.source-gate.outputs.retain_legacy_project_secret_accessor }}"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.source-gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/downloaded-plan
      - name: Verify plan checksum
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/downloaded-plan"
          sha256sum -c secret-manager-iam.tfplan.sha256
      - name: Terraform init
        working-directory: ${{ needs.source-gate.outputs.env_dir }}
        run: terraform init -backend-config=backend.hcl -input=false
      - name: Terraform apply approved plan
        working-directory: ${{ needs.source-gate.outputs.env_dir }}
        run: |
          set -euo pipefail
          terraform apply -input=false "${RUNNER_TEMP}/downloaded-plan/secret-manager-iam.tfplan"
      - name: Summarize post-apply next step for phase1
        if: ${{ inputs.phase == 'phase1' }}
        run: |
          set -euo pipefail
          plan_sha="$(cut -d' ' -f1 "${RUNNER_TEMP}/downloaded-plan/secret-manager-iam.tfplan.sha256")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          record_path="infra/terraform/migration_records/secret_manager_iam/${{ inputs.target_environment }}-phase1-verified.json"
          {
            echo "## Phase1 follow-up required before phase2"
            echo ""
            echo "Commit a tracked verification record at \`${record_path}\` after startup, Secret access, Google login, and CI verification succeed."
            echo ""
            echo '```json'
            echo '{'
            echo "  \"environment\": \"${{ inputs.target_environment }}\","
            echo '  "phase": "phase1",'
            echo '  "retain_legacy_project_secret_accessor": true,'
            echo "  \"github_environment\": \"${{ needs.source-gate.outputs.github_environment }}\","
            echo "  \"phase1_apply_run_id\": ${GITHUB_RUN_ID},"
            echo "  \"phase1_apply_run_url\": \"${run_url}\","
            echo "  \"phase1_apply_head_sha\": \"${GITHUB_SHA}\","
            echo "  \"phase1_plan_sha256\": \"${plan_sha}\","
            echo '  "verification_completed": true,'
            echo '  "verified_at": "REPLACE_WITH_UTC_TIMESTAMP",'
            echo '  "verified_by": "REPLACE_WITH_REVIEWER",'
            echo '  "verification_summary": "REPLACE_WITH_VERIFICATION_NOTES"'
            echo '}'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
