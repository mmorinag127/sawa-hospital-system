name: Deploy Production

on:
  push:
    branches:
      - "release/prod-*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "ocr_pipeline/**"
      - "scripts/**"
      - "Taskfile.yml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:
    inputs:
      order_id:
        description: "Production smoke order id"
        required: false
        default: "ORDedee3bb3"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PROJECT_ID: sawahospitalsystem
  REGION: asia-northeast2
  WEB_SERVICE: web-prod
  WORKER_SERVICE: worker-prod
  WEB_URL: https://web-prod-avlnzjjrca-dt.a.run.app
  WORKER_URL: https://worker-prod-avlnzjjrca-dt.a.run.app
  BACKEND_BASE_IMAGE: asia-northeast2-docker.pkg.dev/sawahospitalsystem/backend/backend:stg-backend-base-yomitoku-cpu-25dfbf2145a3-20260604-043740
  BACKEND_BASE_FINGERPRINT: 25dfbf2145a30df3fc4e702be5b08e1f7126a52737e717af3d4f939f3d3637b4
  OPERATOR_USER: admin
  STRICT_OCR_QUALITY: "1"
  STRICT_OCR_SHEET_GATE: "1"
  CHECK_WEB_PROXY: "1"
  WORKFLOW_V2_DEPLOY_CHECK: "1"

jobs:
  source-gate:
    runs-on: ubuntu-latest
    outputs:
      order_id: ${{ steps.order.outputs.order_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: order
        name: Resolve smoke order
        run: |
          set -euo pipefail
          echo "order_id=${{ inputs.order_id || 'ORDc92f733e' }}" >> "$GITHUB_OUTPUT"
      - name: Assert production release source
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            release/prod-*) ;;
            *)
              echo "prod deploy must run from release/prod-*; got ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain)"
          git fetch origin \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor origin/develop HEAD

  build-backend:
    needs: source-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: fingerprint
        name: Resolve backend base fingerprint
        run: |
          set -euo pipefail
          current_base_fingerprint="$(python3 backend/scripts/backend_base_fingerprint.py backend)"
          echo "current_base_fingerprint=$current_base_fingerprint" >> "$GITHUB_OUTPUT"
      - id: base
        name: Ensure backend base image
        run: |
          set -euo pipefail
          current_base_fingerprint="${{ steps.fingerprint.outputs.current_base_fingerprint }}"
          if [ "$current_base_fingerprint" = "$BACKEND_BASE_FINGERPRINT" ]; then
            echo "image=$BACKEND_BASE_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short_fingerprint="${current_base_fingerprint:0:12}"
          tag="prod-backend-base-yomitoku-cpu-${short_fingerprint}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/backend:${tag}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            -f backend/Dockerfile.base \
            --label "sawa.backend_base_fingerprint=${current_base_fingerprint}" \
            -t "$image" \
            backend
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - id: prepare
        name: Prepare backend deploy source
        run: |
          set -euo pipefail
          deploy_dir="$(./scripts/prepare_hakodate_backend_deploy_source.sh ci-prod-backend)"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and push backend image
        run: |
          set -euo pipefail
          deploy_dir="${{ steps.prepare.outputs.deploy_dir }}"
          current_base_fingerprint="${{ steps.fingerprint.outputs.current_base_fingerprint }}"
          base_image="${{ steps.base.outputs.image }}"
          tag="prod-backend-${GITHUB_SHA::12}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/backend:${tag}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "BASE_IMAGE=${base_image}" \
            --label "sawa.backend_base_image=${base_image}" \
            --label "sawa.backend_base_fingerprint=${current_base_fingerprint}" \
            --label "sawa.git_sha=${GITHUB_SHA}" \
            --label "sawa.release_branch=${GITHUB_REF_NAME}" \
            -t "$image" \
            "$deploy_dir"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: source-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: prepare
        name: Prepare frontend deploy source
        run: |
          set -euo pipefail
          deploy_dir="$(WEB_DEPLOY_LABEL=ci-prod-web ./scripts/prepare_web_deploy_source.sh ci-prod-web)"
          ./scripts/validate_web_deploy_source.sh "$deploy_dir"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and push frontend image
        run: |
          set -euo pipefail
          deploy_dir="${{ steps.prepare.outputs.deploy_dir }}"
          tag="prod-frontend-${GITHUB_SHA::12}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/frontend:${tag}"
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=/api" \
            --build-arg "API_PROXY_TARGET=${WORKER_URL}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=167795504375-hu5316gut0ke8vruc857qsb524q4kq50.apps.googleusercontent.com" \
            --build-arg "NEXT_PUBLIC_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_DEPLOYED_AT=${deployed_at}" \
            -t "$image" \
            "$deploy_dir"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  production-approval:
    needs:
      - source-gate
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved for production deploy
        run: echo "production deploy approved"

  deploy-backend:
    needs:
      - source-gate
      - build-backend
      - production-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy worker-prod
        env:
          IMAGE: ${{ needs.build-backend.outputs.image }}
          ORDER_ID: ${{ needs.source-gate.outputs.order_id }}
          OPERATOR_PASSWORD: ${{ secrets.PROD_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          OPERATOR_USER="$OPERATOR_USER" OPERATOR_PASSWORD="$OPERATOR_PASSWORD" WEB_URL="$WEB_URL" ENSURE_GCLOUD_AUTH=true \
          ./scripts/deploy_worker_prod_with_checks.sh "$IMAGE" "$ORDER_ID"

  deploy-frontend:
    needs:
      - source-gate
      - build-frontend
      - deploy-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy web-prod
        env:
          IMAGE: ${{ needs.build-frontend.outputs.image }}
          ORDER_ID: ${{ needs.source-gate.outputs.order_id }}
          OPERATOR_PASSWORD: ${{ secrets.PROD_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          OPERATOR_USER="$OPERATOR_USER" OPERATOR_PASSWORD="$OPERATOR_PASSWORD" \
          WEB_URL="$WEB_URL" WORKER_URL="$WORKER_URL" WEB_SERVICE="$WEB_SERVICE" WORKER_SERVICE="$WORKER_SERVICE" \
          IMAGE="$IMAGE" ALLOW_WEB_IMAGE_PROMOTION=1 STRICT_OCR_QUALITY="$STRICT_OCR_QUALITY" \
          ENSURE_GCLOUD_AUTH=true \
          ./scripts/deploy_web_with_checks.sh
