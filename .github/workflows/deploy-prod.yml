name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Full source SHA covered by the manually submitted local test receipt"
        required: true
        type: string
      local_test_receipt:
        description: "ECDSA-signed JSON envelope created by scripts/local_hospital_test_runner.py"
        required: true
        type: string
      order_id:
        description: "Production smoke order id"
        required: false
        default: "ORDedee3bb3"
      production_confirmation:
        description: "Enter DEPLOY_PRODUCTION"
        required: true
        type: string
      rollback_run:
        description: "Traffic rollback only: originating deploy run ID (empty for normal deployment)"
        type: string
        required: false
      rollback_attempt:
        description: "Originating run attempt"
        type: string
        default: "1"
      rollback_service:
        description: "Traffic rollback: exact service from pre-migration receipt"
        type: string
      rollback_from:
        description: "Traffic rollback: exact revision currently receiving traffic"
        type: string
      rollback_mode:
        description: "Database recovery keeps services disabled after restoring old traffic"
        type: choice
        options: [traffic, database]
        default: traffic
      rollback_strategy:
        description: "Normal deployment recovery strategy; restore_database requires signed local restore proof"
        type: choice
        options: [migrated_database, restore_database]
        default: migrated_database
      database_recovery_confirmation:
        description: "RESTORE_ORDERS_PROD_DATABASE or, after verification, REOPEN_RESTORED_ORDERS_PROD"
        type: string
      recovery_run:
        description: "Reopening only: completed database recovery run ID"
        type: string
      recovery_attempt:
        description: "Reopening only: completed recovery attempt"
        type: string
        default: "1"
      current_revisions_json:
        description: "Database recovery: exact current revision map for web-prod, worker-prod, ocr-pipeline-prod"
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SAWA_LOCAL_TEST_PUBLIC_KEY: ${{ vars.SAWA_LOCAL_TEST_PUBLIC_KEY }}
  PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
  ROLLBACK_STRATEGY: ${{ inputs.rollback_strategy }}
  PROD_AGENT_RUNTIME_CONFIG: ${{ vars.PROD_AGENT_RUNTIME_CONFIG }}
  NODE_OPTIONS: --use-openssl-ca
  CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/ssl/certs/ca-certificates.crt
  PROJECT_ID: sawahospitalsystem
  REGION: asia-northeast2
  WEB_SERVICE: web-prod
  WORKER_SERVICE: worker-prod
  FACILITY_MASTER_URI: ${{ vars.PROD_FACILITY_MASTER_URI }}
  WEB_URL: https://web-prod-avlnzjjrca-dt.a.run.app
  PORTAL_PUBLIC_ORIGIN: https://web-prod-avlnzjjrca-dt.a.run.app
  PORTAL_SESSION_ABSOLUTE_SECONDS: "604800"
  PORTAL_SESSION_IDLE_SECONDS: "86400"
  PORTAL_LOGIN_TTL_SECONDS: "300"
  SHIFT_WEB_URL: https://shift-web-prod-avlnzjjrca-dt.a.run.app
  SCHOOL_LUNCH_WEB_URL: https://price-web-prod-avlnzjjrca-dt.a.run.app
  WORKER_URL: https://worker-prod-avlnzjjrca-dt.a.run.app
  STRICT_OCR_QUALITY: "1"
  STRICT_OCR_SHEET_GATE: "1"
  CHECK_WEB_PROXY: "1"
  WORKFLOW_V2_DEPLOY_CHECK: "1"
  GOOGLE_OAUTH_CLIENT_ID: "167795504375-hu5316gut0ke8vruc857qsb524q4kq50.apps.googleusercontent.com"
  AUTOMATION_AUTH_AUDIENCE: ${{ vars.PROD_AUTOMATION_AUTH_AUDIENCE }}
  AUTOMATION_AUTH_EMAIL: ${{ vars.PROD_AUTOMATION_AUTH_EMAIL }}
  AUTOMATION_AUTH_SUBJECT: ${{ vars.PROD_AUTOMATION_AUTH_SUBJECT }}
  SCHOOL_LUNCH_AUTOMATION_AUTH_AUDIENCE: ${{ vars.PROD_SCHOOL_LUNCH_AUTOMATION_AUTH_AUDIENCE }}
  SCHOOL_LUNCH_AUTOMATION_AUTH_EMAIL: ${{ vars.PROD_SCHOOL_LUNCH_AUTOMATION_AUTH_EMAIL }}
  SCHOOL_LUNCH_AUTOMATION_AUTH_SUBJECT: ${{ vars.PROD_SCHOOL_LUNCH_AUTOMATION_AUTH_SUBJECT }}
  CLOUD_SQL_PROXY_VERSION: "2.24.1"
  CLOUD_SQL_PROXY_SHA256: "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb"

jobs:
  source-gate:
    runs-on: ubuntu-latest
    outputs:
      order_id: ${{ steps.order.outputs.order_id }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: order
        name: Resolve smoke order
        env:
          SMOKE_ORDER: ${{ inputs.order_id || 'ORDc92f733e' }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_ORDER" =~ ^ORD[0-9a-fA-F]+$ ]]
          printf 'order_id=%s\n' "$SMOKE_ORDER" >> "$GITHUB_OUTPUT"
      - name: Enforce manual production approval substitute
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$ACTOR" = "$OWNER"
          test "$PRODUCTION_CONFIRMATION" = "DEPLOY_PRODUCTION"
      - name: Validate canonical facility runtime source
        run: PYTHONPATH=backend python3 scripts/check_canonical_facility_deploy.py
      - name: Assert production release source
        env:
          ROLLBACK_RUN: ${{ inputs.rollback_run }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            release/prod-*) ;;
            *)
              echo "prod deploy must run from release/prod-*; got ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain)"
          git fetch origin \
            "+refs/heads/develop:refs/remotes/origin/develop" \
            "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ -z "$ROLLBACK_RUN" ]]; then
            git merge-base --is-ancestor origin/develop HEAD
          else
            # The rollback job verifies the original owner-dispatched run and SHA.
            # A later develop commit must not invalidate that immutable release.
            [[ "$ROLLBACK_RUN" =~ ^[1-9][0-9]*$ ]]
          fi
      - name: Require exact successful local hospital test receipt
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          LOCAL_TEST_RECEIPT: ${{ inputs.local_test_receipt }}
          SAWA_LOCAL_TEST_PUBLIC_KEY: ${{ vars.SAWA_LOCAL_TEST_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          printf '%s' "$LOCAL_TEST_RECEIPT" > "$RUNNER_TEMP/local-test-receipt.json"
          python3 scripts/local_hospital_test_runner.py --validate "$RUNNER_TEMP/local-test-receipt.json" --require-full \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-definition-sha256 "$(sha256sum scripts/local_hospital_test_manifest.json | awk '{print $1}')"

  build-backend:
    if: inputs.rollback_run == ''
    needs: source-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      producer_image: ${{ steps.producer.outputs.image }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: fingerprint
        name: Resolve backend base fingerprint
        run: |
          set -euo pipefail
          current_base_fingerprint="$(python3 backend/scripts/backend_base_fingerprint.py backend)"
          echo "current_base_fingerprint=$current_base_fingerprint" >> "$GITHUB_OUTPUT"
      - id: base
        name: Ensure backend base image
        run: |
          set -euo pipefail
          current_base_fingerprint="${{ steps.fingerprint.outputs.current_base_fingerprint }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          existing_image="$(python3 scripts/resolve_backend_base_image.py --fingerprint "$current_base_fingerprint")"
          if [ -n "$existing_image" ]; then
            echo "image=$existing_image" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short_fingerprint="${current_base_fingerprint:0:12}"
          tag="prod-backend-base-yomitoku-cpu-${short_fingerprint}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/backend:${tag}"
          docker build \
            -f backend/Dockerfile.base \
            --label "sawa.backend_base_fingerprint=${current_base_fingerprint}" \
            -t "$image" \
            backend
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - id: prepare
        name: Prepare backend deploy source
        run: |
          set -euo pipefail
          deploy_dir="$(./scripts/prepare_hakodate_backend_deploy_source.sh ci-prod-backend)"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and push backend image
        run: |
          set -euo pipefail
          deploy_dir="${{ steps.prepare.outputs.deploy_dir }}"
          current_base_fingerprint="${{ steps.fingerprint.outputs.current_base_fingerprint }}"
          base_image="${{ steps.base.outputs.image }}"
          tag="prod-backend-${GITHUB_SHA::12}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/backend:${tag}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "BASE_IMAGE=${base_image}" \
            --label "sawa.backend_base_image=${base_image}" \
            --label "sawa.backend_base_fingerprint=${current_base_fingerprint}" \
            --label "sawa.git_sha=${GITHUB_SHA}" \
            --label "sawa.release_branch=${GITHUB_REF_NAME}" \
            -t "$image" \
            "$deploy_dir"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - id: producer
        name: Build and push same-source OCR producer
        run: |
          set -euo pipefail
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/ocr-pipeline:prod-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --label "sawa.git_sha=${GITHUB_SHA}" --label "sawa.release_branch=${GITHUB_REF_NAME}" \
            -t "$image" -f ocr_pipeline/Dockerfile ocr_pipeline
          docker push "$image"
          digest_image="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          echo "image=$digest_image" >> "$GITHUB_OUTPUT"

  build-frontend:
    if: inputs.rollback_run == ''
    needs: source-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: prepare
        name: Prepare frontend deploy source
        run: |
          set -euo pipefail
          deploy_dir="$(WEB_DEPLOY_LABEL=ci-prod-web ./scripts/prepare_web_deploy_source.sh ci-prod-web)"
          ./scripts/validate_web_deploy_source.sh "$deploy_dir"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build and push frontend image
        run: |
          set -euo pipefail
          deploy_dir="${{ steps.prepare.outputs.deploy_dir }}"
          tag="prod-frontend-${GITHUB_SHA::12}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/frontend:${tag}"
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=/api/hospital" \
            --build-arg "API_PROXY_TARGET=${WORKER_URL}" \
            --build-arg "SHIFT_WEB_PROXY_TARGET=${SHIFT_WEB_URL}" \
            --build-arg "SCHOOL_LUNCH_WEB_PROXY_TARGET=${SCHOOL_LUNCH_WEB_URL}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}" \
            --build-arg "NEXT_PUBLIC_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_DEPLOYED_AT=${deployed_at}" \
            -t "$image" \
            "$deploy_dir"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  rollback-traffic:
    if: inputs.rollback_run != ''
    needs: source-gate
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Validate original deploy identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.rollback_run }}
          ATTEMPT: ${{ inputs.rollback_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT" |
            jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg owner "$GITHUB_REPOSITORY_OWNER" '
              .event == "workflow_dispatch" and .head_sha == $sha and .head_branch == $branch and
              .actor.login == $owner and .path == ".github/workflows/deploy-prod.yml"' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rollback_run }}
          name: hospital-rollback-${{ inputs.rollback_run }}-${{ inputs.rollback_attempt }}
          path: ${{ runner.temp }}/rollback
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Restore retained revision traffic only
        if: inputs.rollback_mode == 'traffic'
        env:
          ORIGINAL_RUN: ${{ inputs.rollback_run }}
          TARGET_SERVICE: ${{ inputs.rollback_service }}
          CURRENT_REVISION: ${{ inputs.rollback_from }}
        run: python3 scripts/restore_hospital_traffic.py
      - uses: actions/download-artifact@v4
        if: inputs.rollback_mode == 'database'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rollback_run }}
          name: hospital-db-recovery-point-${{ inputs.rollback_run }}-${{ inputs.rollback_attempt }}
          path: ${{ runner.temp }}/rollback
      - uses: astral-sh/setup-uv@v8.1.0
        if: inputs.rollback_mode == 'database'
        with:
          version: '0.13.4'
      - name: Validate database recovery identity
        if: inputs.rollback_mode == 'database' && inputs.recovery_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.recovery_run }}
          ATTEMPT: ${{ inputs.recovery_attempt }}
          CONFIRMATION: ${{ inputs.database_recovery_confirmation }}
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT" |
            jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg owner "$GITHUB_REPOSITORY_OWNER" --arg confirmation "$CONFIRMATION" '
              .event == "workflow_dispatch" and .head_sha == $sha and .head_branch == $branch and
              .actor.login == $owner and .triggering_actor.login == $owner and .status == "completed" and
              (if $confirmation == "REOPEN_RESTORED_ORDERS_PROD" then .conclusion == "success"
               else $confirmation == "FINISH_RESTORED_ORDERS_PROD" end) and
              .path == ".github/workflows/deploy-prod.yml"' >/dev/null
      - uses: actions/download-artifact@v4
        if: inputs.rollback_mode == 'database' && inputs.recovery_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run }}
          name: hospital-database-recovery-${{ inputs.recovery_run }}-${{ inputs.recovery_attempt }}
          path: ${{ runner.temp }}/recovery
      - name: Restore database with ingress disabled
        if: inputs.rollback_mode == 'database'
        env:
          ORIGINAL_RUN: ${{ inputs.rollback_run }}
          DATABASE_RECOVERY_CONFIRMATION: ${{ inputs.database_recovery_confirmation }}
          CURRENT_REVISIONS_JSON: ${{ inputs.current_revisions_json }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
        run: |
          set -euo pipefail
          if [[ "$DATABASE_RECOVERY_CONFIRMATION" == REOPEN_RESTORED_ORDERS_PROD || "$DATABASE_RECOVERY_CONFIRMATION" == FINISH_RESTORED_ORDERS_PROD ]]; then
            uv run --project backend --extra dev --frozen python scripts/restore_hospital_database.py
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/recovery-proxy" \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256}  $RUNNER_TEMP/recovery-proxy" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/recovery-proxy"
          "$RUNNER_TEMP/recovery-proxy" --address=127.0.0.1 --port=5432 \
            "$PROJECT_ID:$REGION:orders-prod" > "$RUNNER_TEMP/recovery-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true' EXIT
          proxy_ready=false
          for attempt in $(seq 1 30); do
            kill -0 "$proxy_pid" || exit 1
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              proxy_ready=true
              break
            fi
            sleep 1
          done
          [[ "$proxy_ready" == true ]] || { echo 'Recovery proxy not ready' >&2; exit 1; }
          uv run --project backend --extra dev --frozen python scripts/restore_hospital_database.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.rollback_mode == 'database'
        with:
          name: hospital-database-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/database-recovery.json
            ${{ runner.temp }}/reopen-stop-failures.json
            ${{ runner.temp }}/database-reopen.json
          if-no-files-found: warn

  production-approval:
    needs:
      - source-gate
      - build-backend
      - build-frontend
      - build-agent
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - name: Approved for production deploy
        run: echo "production deploy approved"

  prod-db-bootstrap-gate:
    needs:
      - source-gate
      - build-backend
      - build-frontend
      - build-agent
      - production-approval
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PORTAL_BOOTSTRAP_ADMIN_EMAIL: ${{ vars.PROD_PORTAL_BOOTSTRAP_ADMIN_EMAIL }}
      PORTAL_DEPLOY_VERIFICATION_EMAIL: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: '0.13.4'
      - id: auth-db
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: ${{ env.GOOGLE_OAUTH_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify production prerequisites before any database mutation
        env:
          PRODUCTION_FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image }}
          PRODUCTION_AGENT_IMAGE: ${{ needs.build-agent.outputs.image }}
          PRODUCTION_PRODUCER_IMAGE: ${{ needs.build-backend.outputs.producer_image }}
        run: |
          set -euo pipefail
          export PRODUCTION_FRONTEND_IMAGE="$(uv run --project backend --extra dev --frozen python scripts/registry_image_digest.py --image "$PRODUCTION_FRONTEND_IMAGE")"
          uv run --project backend --extra dev --frozen python scripts/hospital_production_preflight.py
      - name: Preserve pre-migration serving revision identities
        uses: actions/upload-artifact@v4
        with:
          name: hospital-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hospital-rollback.json
          if-no-files-found: error
      - name: Save production database recovery point before migration
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/orders-prod-backup.json"
          gcloud sql backups create --project "$PROJECT_ID" --instance orders-prod \
            --description "release-${GITHUB_SHA}-${GITHUB_RUN_ID}" --format=json > "$backup"
          gcloud sql backups list --project "$PROJECT_ID" --instance orders-prod \
            --format=json > "$RUNNER_TEMP/orders-prod-backups.json"
          jq -e --arg description "release-${GITHUB_SHA}-${GITHUB_RUN_ID}" \
            '[.[] | select(.description == $description and .status == "SUCCESSFUL")] | length == 1' \
            "$RUNNER_TEMP/orders-prod-backups.json" >/dev/null
          jq --arg description "release-${GITHUB_SHA}-${GITHUB_RUN_ID}" \
            '[.[] | select(.description == $description and .status == "SUCCESSFUL")][0] | {id,instance,description,status}' \
            "$RUNNER_TEMP/orders-prod-backups.json" > "$RUNNER_TEMP/orders-prod-recovery-point.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hospital-db-recovery-point-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orders-prod-recovery-point.json
          if-no-files-found: error
      - id: cloudsql
        name: Resolve prod Cloud SQL instance
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$WEB_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json)"
          instance="sawahospitalsystem:asia-northeast2:orders-prod"
          printf '%s' "$service_json" | jq -e --arg instance "$instance" \
            '.spec.template.metadata.annotations["run.googleapis.com/cloudsql-instances"] | split(",") | index($instance) != null' >/dev/null
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
      - name: Download Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum -c -
          chmod +x /tmp/cloud-sql-proxy
      - name: Run prod portal DB bootstrap gate
        env:
          INSTANCE_CONNECTION_NAME: ${{ steps.cloudsql.outputs.instance }}
          DEPLOY_ID_TOKEN: ${{ steps.auth-db.outputs.id_token }}
        run: |
          set -euo pipefail
          /tmp/cloud-sql-proxy --address 127.0.0.1 --port 5432 "$INSTANCE_CONNECTION_NAME" \
            >/tmp/cloud-sql-proxy.log 2>&1 &
          proxy_pid=$!
          cleanup() {
            status=$?
            kill "$proxy_pid" >/dev/null 2>&1 || true
            wait "$proxy_pid" >/dev/null 2>&1 || true
            if [[ "$status" -ne 0 && -f /tmp/cloud-sql-proxy.log ]]; then
              cat /tmp/cloud-sql-proxy.log >&2
            fi
            return "$status"
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "cloud-sql-proxy did not become ready on 127.0.0.1:5432" >&2
            exit 1
          fi
          uv run --project backend --extra dev --frozen python scripts/run_prod_schema_adoption.py
          (
            cd backend
            uv run --extra dev python scripts/portal_prod_db_bootstrap.py \
              --project-id "$PROJECT_ID" \
              --region "$REGION" \
              --service "$WEB_SERVICE" \
              --deploy-verification-email "$PORTAL_DEPLOY_VERIFICATION_EMAIL" \
              --deploy-verification-token "$DEPLOY_ID_TOKEN" \
              --live-auth-url "$WEB_URL/api/auth/me" \
              --db-host 127.0.0.1 \
              --db-port 5432
            uv run --extra dev python scripts/portal_automation_db_bootstrap.py \
              --environment prod --project-id "$PROJECT_ID" --region "$REGION" \
              --service "$WEB_SERVICE" --email "$AUTOMATION_AUTH_EMAIL" \
              --db-host 127.0.0.1 --db-port 5432
            uv run --extra dev python scripts/price_automation_db_bootstrap.py \
              --environment prod --project-id "$PROJECT_ID" --region "$REGION" \
              --service "$WEB_SERVICE" --email "$SCHOOL_LUNCH_AUTOMATION_AUTH_EMAIL" \
              --db-host 127.0.0.1 --db-port 5432
          )

  deploy-backend:
    needs:
      - source-gate
      - build-backend
      - prod-db-bootstrap-gate
      - production-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: '0.13.4'
      - id: auth-backend
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: ${{ env.GOOGLE_OAUTH_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Require production shift runtime before integrated portal deploy
        if: env.SHIFT_WEB_URL != ''
        run: |
          set -euo pipefail
          for service in shift-api-prod shift-web-prod; do
            gcloud run services describe "$service" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format='value(status.latestReadyRevisionName)' | grep -q .
          done
          shift_sql="$(gcloud run services describe shift-api-prod \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json | jq -r '.spec.template.metadata.annotations["run.googleapis.com/cloudsql-instances"] // empty')"
          case "$shift_sql" in
            *:shift-prod) ;;
            *) echo "shift-api-prod must use the dedicated shift-prod Cloud SQL instance" >&2; exit 1 ;;
          esac
      - name: Verify existing production delivery prerequisites
        run: python3 scripts/hospital_delivery_config.py
      - name: Deploy same-source production OCR producer
        env:
          PRODUCER_IMAGE: ${{ needs.build-backend.outputs.producer_image }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          uv run --project backend --extra dev --frozen python scripts/stg_ocr_producer_deploy.py --image "$PRODUCER_IMAGE" --source-sha "$GITHUB_SHA"
      - name: Deploy worker-prod
        env:
          IMAGE: ${{ needs.build-backend.outputs.image }}
          ORDER_ID: ${{ needs.source-gate.outputs.order_id }}
          GOOGLE_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          DEPLOY_ID_TOKEN: ${{ steps.auth-backend.outputs.id_token }}
        run: |
          set -euo pipefail
          test "$PORTAL_PUBLIC_ORIGIN" = "$WEB_URL"
          test "$PORTAL_SESSION_ABSOLUTE_SECONDS" = 604800
          test "$PORTAL_SESSION_IDLE_SECONDS" = 86400
          test "$PORTAL_LOGIN_TTL_SECONDS" = 300
          test -n "${HOSPITAL_DELIVERY_ENV:-}"
          test "$(cat hospital-delivery-artifacts/verified-env.txt)" = "$HOSPITAL_DELIVERY_ENV"
          WEB_URL="$WEB_URL" GOOGLE_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
          GOOGLE_IDENTITY_SERVICE_ACCOUNT="$GOOGLE_IDENTITY_SERVICE_ACCOUNT" ENSURE_GCLOUD_AUTH=true \
          RUN_LOCAL_REGRESSION=0 \
          WORKER_EXTRA_ENV_VARS="OCR_OUTPUT_BUCKET=${PROJECT_ID}-prod-raw,OCR_PIPELINE_STATE_URI=gs://${PROJECT_ID}-prod-raw/ocr/pipeline_state.json,PORTAL_PUBLIC_ORIGIN=${PORTAL_PUBLIC_ORIGIN},PORTAL_SESSION_ABSOLUTE_SECONDS=${PORTAL_SESSION_ABSOLUTE_SECONDS},PORTAL_SESSION_IDLE_SECONDS=${PORTAL_SESSION_IDLE_SECONDS},PORTAL_LOGIN_TTL_SECONDS=${PORTAL_LOGIN_TTL_SECONDS},GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID},AUTOMATION_AUTH_AUDIENCE=${AUTOMATION_AUTH_AUDIENCE},AUTOMATION_AUTH_EMAIL=${AUTOMATION_AUTH_EMAIL},AUTOMATION_AUTH_SUBJECT=${AUTOMATION_AUTH_SUBJECT},SCHOOL_LUNCH_AUTOMATION_AUTH_AUDIENCE=${SCHOOL_LUNCH_AUTOMATION_AUTH_AUDIENCE},SCHOOL_LUNCH_AUTOMATION_AUTH_EMAIL=${SCHOOL_LUNCH_AUTOMATION_AUTH_EMAIL},SCHOOL_LUNCH_AUTOMATION_AUTH_SUBJECT=${SCHOOL_LUNCH_AUTOMATION_AUTH_SUBJECT},${HOSPITAL_DELIVERY_ENV}" \
          ./scripts/deploy_worker_prod_with_checks.sh "$IMAGE" "$ORDER_ID"

      - name: Verify live breakfast label display
        env:
          VERIFICATION_TOKEN: ${{ steps.auth-backend.outputs.id_token }}
          ORDER_ID: ${{ needs.source-gate.outputs.order_id }}
        run: |
          set -euo pipefail
          mkdir -p verification
          gcloud run services describe "$WORKER_SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='json(status.latestReadyRevisionName,status.traffic,spec.template.spec.containers[0].image)' > verification/worker.json
          python3 scripts/verify_live_breakfast_labels.py --target prod --order-id "$ORDER_ID" --output-dir verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-label-display-prod
          path: verification/
          retention-days: 7

  deploy-frontend:
    needs:
      - source-gate
      - build-backend
      - build-frontend
      - build-agent
      - deploy-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - id: auth-frontend
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: ${{ env.GOOGLE_OAUTH_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: '0.13.4'
      - name: Deploy web-prod
        env:
          IMAGE: ${{ needs.build-frontend.outputs.image }}
          SAWA_AGENT_RUNTIME_IMAGE: ${{ needs.build-agent.outputs.image }}
          ORDER_ID: ${{ needs.source-gate.outputs.order_id }}
          GOOGLE_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          DEPLOY_ID_TOKEN: ${{ steps.auth-frontend.outputs.id_token }}
        run: |
          set -euo pipefail
          IMAGE="$(uv run --project backend --extra dev --frozen python scripts/registry_image_digest.py --image "$IMAGE")"
          WEB_URL="$WEB_URL" WORKER_URL="$WORKER_URL" WEB_SERVICE="$WEB_SERVICE" WORKER_SERVICE="$WORKER_SERVICE" \
          IMAGE="$IMAGE" ALLOW_WEB_IMAGE_PROMOTION=1 STRICT_OCR_QUALITY="$STRICT_OCR_QUALITY" \
          GOOGLE_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
          GOOGLE_IDENTITY_SERVICE_ACCOUNT="$GOOGLE_IDENTITY_SERVICE_ACCOUNT" \
          ENSURE_GCLOUD_AUTH=true \
          ./scripts/deploy_web_with_checks.sh
      - name: Activate prepared delivery after application verification
        env:
          PRODUCTION_AGENT_IMAGE: ${{ needs.build-agent.outputs.image }}
          PRODUCTION_FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image }}
          PRODUCTION_BACKEND_IMAGE: ${{ needs.build-backend.outputs.image }}
          PRODUCTION_PRODUCER_IMAGE: ${{ needs.build-backend.outputs.producer_image }}
        run: uv run --project backend --extra dev --frozen python scripts/activate_hospital_delivery.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hospital-delivery-activation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hospital-activation-failure.json
          if-no-files-found: ignore

  build-agent:
    needs: [source-gate, build-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: '0.13.4'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable agent runtime
        id: image
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/release/prod-* ]]
          test "$GITHUB_REPOSITORY" = mmorinag127/sawa-hospital-system
          gcloud auth configure-docker asia-northeast2-docker.pkg.dev --quiet
          image="asia-northeast2-docker.pkg.dev/$PROJECT_ID/backend/agent-runtime:prod-$GITHUB_SHA"
          cache_image="${image%:*}:prod-buildcache"
          cache_args=(--cache-to type=inline)
          if gcloud artifacts docker images describe "$cache_image" --format='value(image_summary.digest)' >/dev/null 2>&1; then
            cache_args+=(--cache-from "type=registry,ref=$cache_image")
          fi
          # Agent sources are copied below the dependency layers. An application
          # image as parent invalidates every venv for unrelated backend edits.
          fingerprint="$(python3 backend/scripts/backend_base_fingerprint.py backend)"
          base_image="$(python3 scripts/resolve_backend_base_image.py --fingerprint "$fingerprint")"
          [[ "$base_image" == asia-northeast2-docker.pkg.dev/sawahospitalsystem/backend/backend@sha256:* ]] || {
            echo "agent_verified_dependency_base_required" >&2; exit 1;
          }
          docker buildx build --platform linux/amd64 --push --metadata-file /tmp/agent-build.json \
            "${cache_args[@]}" \
            --label "sawa.git_sha=$GITHUB_SHA" --label sawa.component=agent-runtime \
            --build-arg "BASE_IMAGE=$base_image" --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --file agent_runtime/Dockerfile --tag "$image" --tag "$cache_image" .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/agent-build.json"))["containerimage.digest"])')"
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"
