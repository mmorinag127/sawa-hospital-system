name: Deploy Production Settings Export API

on:
  workflow_call:
    inputs:
      production_confirmation:
        description: Enter DEPLOY_PRODUCTION for the approved settings API hotfix
        required: true
        type: string

env:
  PROJECT_ID: sawahospitalsystem
  REGION: asia-northeast2
  NODE_OPTIONS: --use-openssl-ca
  PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
  GOOGLE_OAUTH_CLIENT_ID: 167795504375-hu5316gut0ke8vruc857qsb524q4kq50.apps.googleusercontent.com
  BASE_IMAGE: asia-northeast2-docker.pkg.dev/sawahospitalsystem/backend/backend@sha256:42e9e7536384881ecd0bde2d075573f963a36f2d86a78e5b812603e1dfe815a0

jobs:
  source-gate:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python scripts/prod_source_export_preflight.py source-gate

  build-backend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      candidate_image: ${{ steps.build.outputs.candidate_image }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Update TLS trust
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          echo SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt >> "$GITHUB_ENV"
          echo PIP_CERT=/etc/ssl/certs/ca-certificates.crt >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi==0.136.1 httpx sqlalchemy psycopg2-binary google-auth google-cloud-storage loguru requests
      - name: Verify export authentication, source snapshot and read-only startup
        env:
          DB_URI: sqlite:////tmp/source-export-unit.sqlite
          PYTHONPATH: backend
          SOURCE_EXPORT_NATIVE_DATABASE_URL: postgresql+psycopg2://fixture:fixture-only@127.0.0.1:5432/orders
        run: python -m pytest backend/tests/unit/test_staging_source_settings.py -q -o addopts=
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: build
        name: Build the unchanged production source plus the read-only API
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          base_image="$BASE_IMAGE"
          if ! docker manifest inspect "$base_image" >/dev/null 2>&1; then
            base_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/backend/backend:source-export-base-${GITHUB_SHA::12}"
            docker build -f backend/Dockerfile.base -t "$base_image" backend
            docker push "$base_image"
          fi
          deploy_dir="$(./scripts/prepare_hakodate_backend_deploy_source.sh prod-source-export)"
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/backend/backend:prod-source-export-${GITHUB_SHA}"
          docker build --build-arg "BASE_IMAGE=$base_image" --label "sawa.git_sha=$GITHUB_SHA" \
            --label "sawa.export_source_base=7ae61ee1033776e2c413a621a2013c4c93002df4" -t "$image" "$deploy_dir"
          docker push "$image"
          image="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          candidate_image="${REGION}-docker.pkg.dev/${PROJECT_ID}/backend/backend:prod-source-export-${GITHUB_SHA}-readonly-candidate"
          printf 'FROM %s\nENV UPLOADED_PDF_RECOVERY_ENABLED=0\n' "$image" > "$RUNNER_TEMP/Dockerfile.source-candidate"
          docker build -f "$RUNNER_TEMP/Dockerfile.source-candidate" -t "$candidate_image" "$RUNNER_TEMP"
          docker push "$candidate_image"
          candidate_image="$(docker inspect --format='{{index .RepoDigests 0}}' "$candidate_image")"
          echo "candidate_image=$candidate_image" >> "$GITHUB_OUTPUT"

  production-approval:
    needs: [source-gate, build-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: test "$PRODUCTION_CONFIRMATION" = DEPLOY_PRODUCTION

  prod-db-bootstrap-gate:
    needs: [source-gate, build-backend, production-approval]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: ${{ env.GOOGLE_OAUTH_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read-only production source gate; no bootstrap or schema writes
        env:
          DEPLOY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          mkdir -p verification
          python scripts/prod_source_export_preflight.py preflight verification/source-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: prod-source-export-proof
          path: verification/source-proof.json
          retention-days: 7

  deploy-backend:
    needs: [source-gate, build-backend, prod-db-bootstrap-gate, production-approval]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: prod-source-export-proof
          path: verification
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: ${{ env.GOOGLE_OAUTH_CLIENT_ID }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Recheck serving source immediately before API-only rollout
        env:
          DEPLOY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: python scripts/prod_source_export_preflight.py preflight verification/source-proof.json
      - name: Restore the reviewed normal recovery configuration
        env:
          DEPLOY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          python scripts/prod_source_export_preflight.py restore-normal
          python scripts/prod_source_export_preflight.py verify verification/source-proof.json
      - name: Assign exact revisions for this run
        run: |
          echo "CANDIDATE_REVISION=worker-prod-se${GITHUB_RUN_ID}c${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "NORMAL_REVISION=worker-prod-se${GITHUB_RUN_ID}n${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Create the API candidate with no business traffic
        env:
          IMAGE: ${{ needs.build-backend.outputs.candidate_image }}
        run: |
          set -euo pipefail
          gcloud run deploy worker-prod --project="$PROJECT_ID" --region="$REGION" \
            --image="$IMAGE" --revision-suffix="${CANDIDATE_REVISION#worker-prod-}" --no-traffic --tag=staging-source-api --quiet
          gcloud run services describe worker-prod --project="$PROJECT_ID" --region="$REGION" \
            --format='json(status.traffic)' > verification/runtime.json
          python scripts/prod_source_export_preflight.py candidate verification/runtime.json
      - name: Verify unchanged production effective settings before routing traffic
        env:
          DEPLOY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: python scripts/prod_source_export_preflight.py verify verification/source-proof.json
      - id: coordinator-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_PROD }}
          token_format: id_token
          id_token_audience: https://worker-stg-avlnzjjrca-dt.a.run.app
          id_token_include_email: true
      - name: Require the actual staging coordinator to import the production snapshot
        env:
          COORDINATOR_PROBE_ID_TOKEN: ${{ steps.coordinator-auth.outputs.id_token }}
        run: python scripts/prod_source_export_preflight.py probe verification/coordinator-proof.json
      - name: Prepare and verify the exact normal revision before routing
        env:
          IMAGE: ${{ needs.build-backend.outputs.image }}
          EXACT_IMAGE: ${{ needs.build-backend.outputs.image }}
          DEPLOY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          gcloud run deploy worker-prod --project="$PROJECT_ID" --region="$REGION" --image="$IMAGE" \
            --revision-suffix="${NORMAL_REVISION#worker-prod-}" --no-traffic --tag=staging-source-normal --quiet
          export EXACT_REVISION="$NORMAL_REVISION"
          python scripts/prod_source_export_preflight.py exact-revision
          export CANDIDATE_URL="$(gcloud run services describe worker-prod --project="$PROJECT_ID" --region="$REGION" --format=json | python -c 'import json,sys; print(next(r["url"] for r in json.load(sys.stdin)["status"]["traffic"] if r.get("tag")=="staging-source-normal"))')"
          python scripts/prod_source_export_preflight.py verify verification/source-proof.json
          gcloud run services update-traffic worker-prod --project="$PROJECT_ID" --region="$REGION" --to-revisions="${NORMAL_REVISION}=100" --quiet
          export REQUIRE_SERVING=true
          python scripts/prod_source_export_preflight.py exact-revision
          export CANDIDATE_URL=
          python scripts/prod_source_export_preflight.py verify verification/source-proof.json
      - name: Restore reviewed normal production on any rollout failure
        if: failure()
        env:
          DEPLOY_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          python scripts/prod_source_export_preflight.py restore-normal
          CANDIDATE_URL= python scripts/prod_source_export_preflight.py verify verification/source-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-source-export-result
          path: verification/*-proof.json
          retention-days: 7
