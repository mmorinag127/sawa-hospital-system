name: Hospital readonly SQLite and owned PG16 (non-deploy)
on:
  push:
    branches:
      - codex/modernization-readonly-pg-ci-20261012
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --use-openssl-ca
  CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  readonly-boundary:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/codex/modernization-readonly-pg-ci-20261012' && github.event.repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: readonly
            root-prefix: sawa-ro
            artifact-prefix: hospital-readonly
          - suite: c1
            root-prefix: sawa-c1
            artifact-prefix: hospital-c1
          - suite: c1-guards
            root-prefix: sawa-c1-guards
            artifact-prefix: hospital-c1-guards
          - suite: menu-identity
            root-prefix: sawa-menu-identity
            artifact-prefix: hospital-menu-identity
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update Python trust bundles
        run: python -m pip install --upgrade --no-deps 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70' 'certifi @ https://files.pythonhosted.org/packages/c4/51/29046e48f693c54e5b7412216d447a1d8362c9653148d98c02cdf65fa733/certifi-2026.10.19-py3-none-any.whl#sha256=42d35340cc5b9ba78e818ddbff0c5b1c2b779de448a340fd1b989f5fa8670e1b'
      - name: Record actual source SHA
        run: |
          mkdir -p "$RUNNER_TEMP/readonly-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/readonly-evidence/git-sha.txt"
      - name: Install production dependencies and pytest
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt pytest httpx2
      - name: Existing selected module, all SQLite and PostgreSQL cases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.suite }}" == c1-guards || "${{ matrix.suite }}" == menu-identity ]]; then
            status=0
            (
              if [[ -e /private || -L /private ]]; then
                printf '%s\n' 'Refusing existing or aliased /private' >&2
                exit 1
              fi
              sudo mkdir -m 700 -- /private || exit $?
              sudo chown "$(id -u):$(id -g)" -- /private || exit $?
              mkdir -m 700 -- /private/tmp || exit $?
            ) 2>&1 | tee "$RUNNER_TEMP/readonly-evidence/private-parent.log" || status=$?
            printf '%s\n' "$status" > "$RUNNER_TEMP/readonly-evidence/private-parent-exit.txt"
            if [[ "$status" != 0 ]]; then exit "$status"; fi
          fi
          status=0
          python scripts/run_readonly_pg_tests.py --source "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --suite "${{ matrix.suite }}" \
            2>&1 | tee "$RUNNER_TEMP/readonly-evidence/runner.log" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/readonly-evidence/runner-exit.txt"
          exit "$status"
      - name: Preserve evidence including failures and shutdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/readonly-evidence/git-sha.txt
            ${{ runner.temp }}/readonly-evidence/runner.log
            ${{ runner.temp }}/readonly-evidence/runner-exit.txt
            ${{ runner.temp }}/readonly-evidence/private-parent.log
            ${{ runner.temp }}/readonly-evidence/private-parent-exit.txt
            /tmp/${{ matrix.root-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.log
            /tmp/${{ matrix.root-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            /tmp/${{ matrix.root-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/evidence/results.xml
            /tmp/${{ matrix.root-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}/evidence/git-sha.txt
          if-no-files-found: warn
