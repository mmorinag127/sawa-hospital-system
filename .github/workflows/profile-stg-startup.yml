name: Profile Staging Startup
on:
  workflow_dispatch:
    inputs:
      inventory:
        description: Base64 exact existing staging image/revision inventory
        required: true
        type: string
      local_receipt:
        description: Signed exact-source local profiling checks
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-stg
  cancel-in-progress: false
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/ssl/certs/ca-certificates.crt
jobs:
  profile:
    if: github.ref == 'refs/heads/develop' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          project_id: sawahospitalsystem
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STG }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_STG }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Profile existing immutable staging images and restore settings
        env:
          STARTUP_PROFILE_INVENTORY: ${{ inputs.inventory }}
          STARTUP_PROFILE_RECEIPT: ${{ inputs.local_receipt }}
          SAWA_LOCAL_TEST_PUBLIC_KEY: ${{ vars.SAWA_LOCAL_TEST_PUBLIC_KEY }}
        run: python3 scripts/profile_stg_startup.py --profile --output "$RUNNER_TEMP/startup-profile"
      - name: Preserve sanitized timing evidence
        if: always()
        env:
          STARTUP_PROFILE_INVENTORY: ${{ inputs.inventory }}
          STARTUP_PROFILE_RECEIPT: ${{ inputs.local_receipt }}
          SAWA_LOCAL_TEST_PUBLIC_KEY: ${{ vars.SAWA_LOCAL_TEST_PUBLIC_KEY }}
        run: python3 scripts/profile_stg_startup.py --restore --output "$RUNNER_TEMP/startup-profile"
      - name: Upload sanitized timing evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/startup-profile
          if-no-files-found: warn
          retention-days: 7
