name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_URI: sqlite:///./test.db
      FACILITY_MASTER_PATH: src/data/facility_master.template.json
      INGEST_POLICY_PATH: src/data/ingest_policy.template.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -e ".[dev]" --no-build-isolation
      - name: Run backend tests (US1-4)
        working-directory: backend
        run: |
          python -m pytest \
            tests/contract/test_ingest.py \
            tests/integration/test_ingest_supersede.py \
            tests/integration/test_facility_unresolved.py \
            tests/integration/test_line_corrections.py \
            tests/integration/test_status_flow.py \
            tests/integration/test_menu_upload.py \
            tests/integration/test_menu_edits_output.py \
            tests/integration/test_menu_override.py \
            tests/contract/test_facility_config.py \
            tests/integration/test_facility_config_apply.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  deploy-dev:
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: mythic-lattice-483204-t8
      REGION: asia-northeast1
      REGISTRY: asia-northeast1-docker.pkg.dev/mythic-lattice-483204-t8/backend
      TF_ENV_DIR: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Set image tags
        run: |
          TAG_SUFFIX=$(date -u +%Y%m%d-%H%M%S)
          echo "TAG_SUFFIX=${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "FRONTEND_TAG=dev-frontend-${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "BACKEND_TAG=dev-backend-${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "OCR_TAG=dev-ocr-${TAG_SUFFIX}" >> "$GITHUB_ENV"
      - name: Build and push images
        run: |
          docker build -t "${REGISTRY}/frontend:${FRONTEND_TAG}" -f frontend/Dockerfile frontend
          docker push "${REGISTRY}/frontend:${FRONTEND_TAG}"
          docker build -t "${REGISTRY}/backend:${BACKEND_TAG}" -f backend/Dockerfile backend
          docker push "${REGISTRY}/backend:${BACKEND_TAG}"
          docker build -t "${REGISTRY}/ocr-pipeline:${OCR_TAG}" -f ocr_pipeline/Dockerfile ocr_pipeline
          docker push "${REGISTRY}/ocr-pipeline:${OCR_TAG}"
      - name: Write terraform override
        run: |
          cat > "${TF_ENV_DIR}/terraform.auto.tfvars.json" <<EOF
          {
            "cloudrun_services": {
              "web": "${REGISTRY}/frontend:${FRONTEND_TAG}",
              "worker": "${REGISTRY}/backend:${BACKEND_TAG}",
              "ocr-pipeline": "${REGISTRY}/ocr-pipeline:${OCR_TAG}"
            }
          }
          EOF
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -backend-config=backend.hcl
      - name: Terraform apply
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars
