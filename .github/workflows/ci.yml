name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - develop
      - main
      - master
      - "release/prod-*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run every test regardless of unchanged dependencies
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --use-openssl-ca
  CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Update Python trust bundles
        run: python -m pip install --upgrade --no-deps 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70' 'certifi @ https://files.pythonhosted.org/packages/c4/51/29046e48f693c54e5b7412216d447a1d8362c9653148d98c02cdf65fa733/certifi-2026.10.19-py3-none-any.whl#sha256=42d35340cc5b9ba78e818ddbff0c5b1c2b779de448a340fd1b989f5fa8670e1b'
      - name: Infra workflow guard tests
        run: python -m unittest infra/terraform/tests/test_secret_manager_iam_migration.py -v
      - name: Verify TLS trust and workflow guards
        run: |
          python -m pip install PyYAML
          python scripts/test_tls_trust.py -v
          python scripts/test_tls_workflows.py -v

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [us1-4, saved-source, review-resolution]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_DB: bootstrap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_BOOTSTRAP_DB_URI: postgresql+psycopg2://postgres:ci-bootstrap-only@localhost:5432/bootstrap_test
      DB_URI: sqlite:///./test.db
      FACILITY_MASTER_PATH: src/data/facility_master.template.json
      INGEST_POLICY_PATH: src/data/ingest_policy.template.json
      PYTHONPATH: ${{ github.workspace }}/infra/ci
      PYTEST_ADDOPTS: -p pytest_impact --testmon
      SAWA_IMPACT_ROOT: ${{ github.workspace }}
      SAWA_IMPACT_STATE: ${{ github.workspace }}/.ci-impact/${{ matrix.suite }}
      SAWA_IMPACT_SPLIT_RUNS: '1'
      TESTMON_DATAFILE: ${{ github.workspace }}/.ci-impact/${{ matrix.suite }}/testmon.sqlite
      SAWA_IMPACT_FULL: ${{ (inputs.full_tests || startsWith(github.ref, 'refs/heads/release/prod-')) && '1' || '0' }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Update Python trust bundles
        run: python -m pip install --upgrade --no-deps 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70' 'certifi @ https://files.pythonhosted.org/packages/c4/51/29046e48f693c54e5b7412216d447a1d8362c9653148d98c02cdf65fa733/certifi-2026.10.19-py3-none-any.whl#sha256=42d35340cc5b9ba78e818ddbff0c5b1c2b779de448a340fd1b989f5fa8670e1b'
      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -e ".[dev]" --no-build-isolation
      - name: Install per-test dependency tracker
        run: python -m pip install "pytest-testmon==2.2.0"
      - name: Identify test runner image
        id: impact-runtime
        run: |
          set -euo pipefail
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf 'image=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore trusted test dependencies
        uses: actions/cache/restore@v4
        with:
          path: .ci-impact/${{ matrix.suite }}
          key: test-impact-v1-${{ runner.os }}-${{ steps.impact-runtime.outputs.image }}-${{ matrix.suite }}-${{ hashFiles('backend/pyproject.toml', 'infra/ci/**/*.py', 'infra/ci/**/*.mjs', 'infra/ci/**/*.cjs', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            test-impact-v1-${{ runner.os }}-${{ steps.impact-runtime.outputs.image }}-${{ matrix.suite }}-${{ hashFiles('backend/pyproject.toml', 'infra/ci/**/*.py', 'infra/ci/**/*.mjs', 'infra/ci/**/*.cjs', '.github/workflows/ci.yml') }}-
      - name: Install CPU torch for OCR contract tests
        working-directory: backend
        run: |
          # CI tensor contracts only; production OCR remains on its declared runtime.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0+cpu"
          python -m pip install "huggingface-hub==0.36.2" "safetensors==0.7.0"
          python -c 'import torch; assert torch.__version__ == "2.10.0+cpu"; assert torch.version.cuda is None'
      - name: Check backend undefined names
        working-directory: backend
        run: python -m ruff check --no-cache --select F821 src
      - name: Verify parallel CI coverage and required gate
        run: python infra/terraform/tests/test_ci_backend_parallel.py -v
      - name: Verify per-test selection safety
        run: |
          python -m unittest discover -s infra/ci/tests -p test_pytest_impact.py -v
          python -m unittest discover -s infra/ci/tests -p test_workflow_impact.py -v
      - name: Verify serving and frozen image dependency alignment
        run: python scripts/test_runtime_cv_dependency_alignment.py -v
      - name: Backend dependency audit
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit --local --skip-editable
      - name: Run backend tests (US1-4)
        if: matrix.suite == 'us1-4'
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p .logs
          python -m pytest \
            tests/contract/test_ingest.py \
            tests/integration/test_ingest_supersede.py \
            tests/integration/test_facility_unresolved.py \
            tests/integration/test_line_corrections.py \
            tests/integration/test_status_flow.py \
            tests/integration/test_menu_upload.py \
            tests/integration/test_menu_edits_output.py \
            tests/integration/test_menu_override.py \
            tests/contract/test_facility_config.py \
            tests/contract/test_auth_guardrails.py \
            tests/contract/test_automation_auth.py \
            tests/contract/test_school_lunch_automation_auth.py \
            tests/contract/test_automation_bootstrap.py \
            tests/contract/test_price_automation_bootstrap.py \
            tests/contract/test_automation_bootstrap_postgres.py \
            tests/contract/test_prod_portal_db_bootstrap_gate.py \
            tests/unit/test_portal_access_bootstrap_service.py \
            tests/integration/test_portal_admin_write_authority.py \
            tests/integration/test_delivery_admission_hardening.py \
            tests/integration/test_current_actor_authority.py \
            tests/unit/test_portal_sqlite_constraint_contract.py \
            tests/unit/test_portal_prod_db_bootstrap_script.py \
            tests/unit/test_independent_ocr_ui_workflow.py \
            tests/integration/test_facility_config_apply.py \
            --junitxml=.logs/pytest-junit.xml \
            -vv 2>&1 | tee .logs/pytest.log
      - name: Verify initial saved-source preservation
        if: matrix.suite == 'saved-source'
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p .logs
          python -m pytest --confcutdir=tests/unit \
            tests/unit/test_menu_normalization_import.py \
            tests/unit/test_monthly_menu_read_batch.py \
            tests/unit/test_order_menu_date_lookup_parity.py \
            tests/unit/test_initial_saved_source_service.py \
            tests/unit/test_initial_saved_import_service.py \
            tests/unit/test_output_read_import_policy.py \
            tests/unit/test_saved_bag_read_parity.py \
            tests/unit/test_prepare_stg_saved_import.py \
            tests/unit/test_initial_saved_fixture_preservation.py \
            tests/unit/test_saved_fixture_http_evidence.py \
            tests/unit/test_stg_preflight_entrypoint.py \
            tests/unit/test_hospital_delivery_config.py \
            tests/unit/test_hospital_delivery_cli.py \
            tests/unit/test_stg_ocr_producer_deploy.py \
            tests/unit/test_stg_ocr_resume_upload.py \
            tests/unit/test_stg_hakodate_verification.py \
            tests/integration/test_staging_db_target.py \
            tests/integration/test_verify_stg_output_source.py \
            tests/unit/test_reviewed_ocr_diagnostic.py \
            tests/unit/test_daily_bag_canonical_category.py \
            tests/unit/test_weekly_weight_period.py \
            tests/unit/test_order_list_response_ownership.py \
            tests/unit/test_ocr_registry_retirement.py \
            --junitxml=.logs/saved-source-junit.xml -q
      - name: Verify OCR review-resolution root regression
        if: matrix.suite == 'review-resolution'
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p .logs
          python -m pytest \
            tests/unit/test_ocr_selectability_single_validation.py \
            tests/unit/test_ocr_validation_dataflow.py \
            tests/unit/test_ocr_read_projection_ownership.py \
            tests/unit/test_validation_readonly_borrow.py \
            tests/unit/test_acceptance_validation_dataflow.py \
            tests/unit/test_original_source_dataflow.py \
            tests/unit/test_inspection_demand_read.py \
            tests/unit/test_hakodate_review_resolution_root.py \
            tests/unit/test_hakodate_blank_input_review.py \
            tests/unit/test_hakodate_blank_review_persistence.py \
            tests/unit/test_hakodate_raw_authority.py \
            tests/unit/test_hakodate_empty_sequence_model.py \
            tests/unit/test_hakodate_preprocess_observation.py \
            tests/unit/test_snapshot_serialization_db_free.py \
            tests/unit/test_hakodate_text_recognizer_preprocess.py \
            tests/unit/test_yomitoku_text_recognizer_topk.py \
            tests/unit/test_stg_recognition_review_verification.py \
            tests/unit/test_stg_ocr_native_empty_resolution.py \
            tests/unit/test_stg_ocr_verified_source_case.py \
            tests/unit/test_native_ingest_boundary.py \
            tests/unit/test_native_ingest_sql_component.py \
            tests/unit/test_native_document_source.py \
            tests/unit/test_canonical_saved_projection_regression.py \
            tests/unit/test_saved_sheet_setting_invalidation.py \
            tests/unit/test_native_recognition_recovery.py \
            tests/unit/test_native_quantity_projection_contract.py \
            tests/unit/test_recognition_review_result_ownership.py \
            tests/unit/test_recognition_checkpoint_geometry_invalidation.py \
            tests/unit/test_recognition_recovery_warning_lifecycle.py \
            tests/unit/test_recognition_review_acceptance.py \
            tests/unit/test_recovery_invalidation_checkpoint_roundtrip.py \
            tests/unit/test_hakodate_ocr_checkpoint_service.py \
            tests/unit/test_hakodate_checkpoint_resume_runtime.py \
            tests/unit/test_native_ingest_protocol.py \
            --junitxml=.logs/review-resolution-junit.xml \
            -q -rs 2>&1 | tee .logs/review-resolution.log
      - name: Verify portal login and server session
        if: matrix.suite == 'us1-4'
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest \
            tests/contract/test_portal_google_auth.py \
            tests/unit/test_portal_session.py \
            tests/unit/test_portal_session_catalog.py \
            tests/unit/test_portal_auth_failure_contract.py \
            --junitxml=.logs/portal-session-junit.xml \
            -q -rs 2>&1 | tee .logs/portal-session.log
      - name: Verify packaged hospital baseline migration
        if: matrix.suite == 'us1-4'
        working-directory: backend
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH" python -m pytest \
            ../experiments/agent_assistant/tests/test_prepare_packaged.py -q
      - name: Save trusted test dependencies
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: .ci-impact/${{ matrix.suite }}
          key: test-impact-v1-${{ runner.os }}-${{ steps.impact-runtime.outputs.image }}-${{ matrix.suite }}-${{ hashFiles('backend/pyproject.toml', 'infra/ci/**/*.py', 'infra/ci/**/*.mjs', 'infra/ci/**/*.cjs', '.github/workflows/ci.yml') }}-${{ github.sha }}
      - name: Upload per-test selection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-impact-${{ matrix.suite }}
          include-hidden-files: true
          path: .ci-impact/${{ matrix.suite }}/**/selection.json
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs-${{ matrix.suite }}
          include-hidden-files: true
          path: backend/.logs
      - name: Backend log summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Backend pytest log (tail)";
            echo '```';
            for log in .logs/*.log; do
              [ -f "$log" ] && tail -n 200 "$log";
            done
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  backend-required:
    name: backend
    if: always()
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all backend suites to pass
        env:
          RESULT: ${{ needs.backend.result }}
        run: test "$RESULT" = success

  frontend:
    runs-on: ubuntu-latest
    env:
      SAWA_IMPACT_ROOT: ${{ github.workspace }}
      SAWA_NODE_IMPACT_STATE: ${{ github.workspace }}/.ci-impact/frontend
      SAWA_IMPACT_FULL: ${{ (inputs.full_tests || startsWith(github.ref, 'refs/heads/release/prod-')) && '1' || '0' }}
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Identify test runner image
        id: impact-runtime
        run: |
          set -euo pipefail
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf 'image=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore trusted frontend test dependencies
        uses: actions/cache/restore@v4
        with:
          path: .ci-impact/frontend
          key: node-impact-v1-${{ runner.os }}-${{ steps.impact-runtime.outputs.image }}-${{ hashFiles('frontend/package-lock.json', 'infra/ci/**/*.py', 'infra/ci/**/*.mjs', 'infra/ci/**/*.cjs', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            node-impact-v1-${{ runner.os }}-${{ steps.impact-runtime.outputs.image }}-${{ hashFiles('frontend/package-lock.json', 'infra/ci/**/*.py', 'infra/ci/**/*.mjs', 'infra/ci/**/*.cjs', '.github/workflows/ci.yml') }}-
      - name: Verify Node test selection safety
        run: python3 -m unittest discover -s infra/ci/tests -p test_node_impact.py -v
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Frontend lint
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p .logs
          npm run lint 2>&1 | tee .logs/lint.log
      - name: Install WebKit for frontend route contract tests
        working-directory: frontend
        run: npx --no-install playwright install --with-deps webkit
      - name: Frontend route contract tests
        working-directory: frontend
        env:
          NODE_OPTIONS: --use-openssl-ca --import=${{ github.workspace }}/infra/ci/node-impact/register.mjs
        run: |
          set -euo pipefail
          mkdir -p .logs
          npm run test:config 2>&1 | tee .logs/test-config.log
          node --test tests/inspection-demand-read.test.mjs
      - name: Save trusted frontend test dependencies
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: .ci-impact/frontend
          key: node-impact-v1-${{ runner.os }}-${{ steps.impact-runtime.outputs.image }}-${{ hashFiles('frontend/package-lock.json', 'infra/ci/**/*.py', 'infra/ci/**/*.mjs', 'infra/ci/**/*.cjs', '.github/workflows/ci.yml') }}-${{ github.sha }}
      - name: Upload frontend test selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-selection
          include-hidden-files: true
          path: .ci-impact/frontend/*.report.json
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee .logs/typecheck.log
      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-logs
          include-hidden-files: true
          path: frontend/.logs
      - name: Frontend log summary
        if: always()
        working-directory: frontend
        run: |
          {
            echo "## Frontend lint log (tail)";
            echo '```';
            tail -n 200 .logs/lint.log || echo "no lint log";
            echo '```';
            echo "## Frontend typecheck log (tail)";
            echo '```';
            tail -n 200 .logs/typecheck.log || echo "no typecheck log";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
