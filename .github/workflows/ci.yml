name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_URI: sqlite:///./test.db
      FACILITY_MASTER_PATH: src/data/facility_master.template.json
      INGEST_POLICY_PATH: src/data/ingest_policy.template.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -e ".[dev]" --no-build-isolation
      - name: Run backend tests (US1-4)
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p .logs
          python -m pytest \
            tests/contract/test_ingest.py \
            tests/integration/test_ingest_supersede.py \
            tests/integration/test_facility_unresolved.py \
            tests/integration/test_line_corrections.py \
            tests/integration/test_status_flow.py \
            tests/integration/test_menu_upload.py \
            tests/integration/test_menu_edits_output.py \
            tests/integration/test_menu_override.py \
            tests/contract/test_facility_config.py \
            tests/integration/test_facility_config_apply.py \
            --junitxml=.logs/pytest-junit.xml \
            -vv 2>&1 | tee .logs/pytest.log
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: backend/.logs
      - name: Backend log summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Backend pytest log (tail)";
            echo '```';
            tail -n 200 .logs/pytest.log || echo "no pytest log";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p .logs
          npm run lint 2>&1 | tee .logs/lint.log
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee .logs/typecheck.log
      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-logs
          path: frontend/.logs
      - name: Frontend log summary
        if: always()
        working-directory: frontend
        run: |
          {
            echo "## Frontend lint log (tail)";
            echo '```';
            tail -n 200 .logs/lint.log || echo "no lint log";
            echo '```';
            echo "## Frontend typecheck log (tail)";
            echo '```';
            tail -n 200 .logs/typecheck.log || echo "no typecheck log";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
