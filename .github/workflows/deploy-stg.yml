name: Deploy Staging

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "ocr_pipeline/**"
      - "scripts/**"
      - "Taskfile.yml"
      - ".github/workflows/deploy-stg.yml"
  workflow_dispatch:

concurrency:
  group: deploy-stg
  cancel-in-progress: false

env:
  PROJECT_ID: sawahospitalsystem
  REGION: asia-northeast2
  WEB_SERVICE: web-stg
  WORKER_SERVICE: worker-stg
  WEB_URL: https://web-stg-avlnzjjrca-dt.a.run.app
  WORKER_URL: https://worker-stg-avlnzjjrca-dt.a.run.app
  BACKEND_BASE_IMAGE: asia-northeast2-docker.pkg.dev/sawahospitalsystem/backend/backend:stg-backend-base-yomitoku-cpu-ecfa03d510c6-20260521-095213
  BACKEND_BASE_FINGERPRINT: ecfa03d510c6a3cd8c769e4ed85ab418c0b242e9b651d57c3c2f7bc827e42d93
  ORDER_ID: ORD17872bf3
  OPERATOR_USER: admin
  STRICT_OCR_QUALITY: "0"
  STRICT_OCR_SHEET_GATE: "0"
  CHECK_WEB_PROXY: "1"
  WORKFLOW_V2_DEPLOY_CHECK: "1"
  ALLOW_BASIC_ONLY_AUTH: "1"

jobs:
  source-gate:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert staging source
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop"
          test -z "$(git status --porcelain)"
          git fetch origin "+refs/heads/develop:refs/remotes/origin/develop"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
      - id: changes
        name: Detect changed deploy surfaces
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi
          git cat-file -e "${before}^{commit}"
          git diff --name-only "$before" "$after" > /tmp/changed-files.txt
          if grep -Eq '^(backend|ocr_pipeline)/|^scripts/|^Taskfile.yml$|^\.github/workflows/deploy-stg\.yml$' /tmp/changed-files.txt; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^frontend/|^scripts/|^Taskfile.yml$|^\.github/workflows/deploy-stg\.yml$' /tmp/changed-files.txt; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: source-gate
    if: needs.source-gate.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          quota_project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STG }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_STG }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: fingerprint
        name: Validate backend base fingerprint
        run: |
          set -euo pipefail
          current_base_fingerprint="$(python3 backend/scripts/backend_base_fingerprint.py backend)"
          test "$current_base_fingerprint" = "$BACKEND_BASE_FINGERPRINT"
          echo "current_base_fingerprint=$current_base_fingerprint" >> "$GITHUB_OUTPUT"
      - id: prepare
        name: Prepare backend deploy source
        run: |
          set -euo pipefail
          deploy_dir="$(./scripts/prepare_hakodate_backend_deploy_source.sh ci-stg-backend)"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
      - id: build
        name: Submit backend Cloud Build
        run: |
          set -euo pipefail
          gcloud --quiet config set builds/use_kaniko False >/dev/null
          deploy_dir="${{ steps.prepare.outputs.deploy_dir }}"
          current_base_fingerprint="${{ steps.fingerprint.outputs.current_base_fingerprint }}"
          tag="stg-backend-${GITHUB_SHA::12}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/backend:${tag}"
          build_config="$(mktemp)"
          {
            echo "steps:"
            echo "  - name: 'gcr.io/cloud-builders/docker'"
            echo "    args: ['build', '--build-arg', 'BASE_IMAGE=${BACKEND_BASE_IMAGE}', '--label', 'sawa.backend_base_image=${BACKEND_BASE_IMAGE}', '--label', 'sawa.backend_base_fingerprint=${current_base_fingerprint}', '--label', 'sawa.git_sha=${GITHUB_SHA}', '--label', 'sawa.release_branch=develop', '-t', '${image}', '.']"
            echo "images: ['${image}']"
          } > "$build_config"
          gcloud builds submit "$deploy_dir" --project="$PROJECT_ID" --config="$build_config"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: source-gate
    if: needs.source-gate.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          quota_project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STG }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_STG }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: prepare
        name: Prepare frontend deploy source
        run: |
          set -euo pipefail
          deploy_dir="$(WEB_DEPLOY_LABEL=ci-stg-web ./scripts/prepare_web_deploy_source.sh ci-stg-web)"
          ./scripts/validate_web_deploy_source.sh "$deploy_dir"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
      - id: build
        name: Submit frontend Cloud Build
        run: |
          set -euo pipefail
          gcloud --quiet config set builds/use_kaniko False >/dev/null
          deploy_dir="${{ steps.prepare.outputs.deploy_dir }}"
          tag="stg-frontend-${GITHUB_SHA::12}-$(date -u +%Y%m%d-%H%M%S)"
          image="asia-northeast2-docker.pkg.dev/${PROJECT_ID}/backend/frontend:${tag}"
          build_config="$(mktemp)"
          {
            echo "steps:"
            echo "  - name: 'gcr.io/cloud-builders/docker'"
            echo "    args: ['build', '--build-arg', 'NEXT_PUBLIC_API_BASE_URL=/api', '--build-arg', 'API_PROXY_TARGET=${WORKER_URL}', '--build-arg', 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=', '-t', '${image}', '.']"
            echo "images: ['${image}']"
          } > "$build_config"
          gcloud builds submit "$deploy_dir" --project="$PROJECT_ID" --config="$build_config"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs:
      - source-gate
      - build-backend
    if: needs.source-gate.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          quota_project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STG }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_STG }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy worker-stg
        env:
          IMAGE: ${{ needs.build-backend.outputs.image }}
          OPERATOR_PASSWORD: ${{ secrets.STG_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          OPERATOR_USER="$OPERATOR_USER" OPERATOR_PASSWORD="$OPERATOR_PASSWORD" \
          PROJECT_ID="$PROJECT_ID" REGION="$REGION" SERVICE="$WORKER_SERVICE" WEB_SERVICE="$WEB_SERVICE" WEB_URL="$WEB_URL" \
          RUN_LOCAL_REGRESSION=0 STRICT_OCR_SHEET_GATE="$STRICT_OCR_SHEET_GATE" STRICT_OCR_QUALITY="$STRICT_OCR_QUALITY" \
          CHECK_WEB_PROXY="$CHECK_WEB_PROXY" WORKFLOW_V2_DEPLOY_CHECK="$WORKFLOW_V2_DEPLOY_CHECK" ALLOW_BASIC_ONLY_AUTH="$ALLOW_BASIC_ONLY_AUTH" \
          ./scripts/deploy_worker_prod_with_checks.sh "$IMAGE" "$ORDER_ID"

  deploy-frontend:
    needs:
      - source-gate
      - build-frontend
      - deploy-backend
    if: |
      always() &&
      needs.source-gate.outputs.frontend_changed == 'true' &&
      needs.build-frontend.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          quota_project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STG }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_STG }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy web-stg
        env:
          IMAGE: ${{ needs.build-frontend.outputs.image }}
          OPERATOR_PASSWORD: ${{ secrets.STG_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          OPERATOR_USER="$OPERATOR_USER" OPERATOR_PASSWORD="$OPERATOR_PASSWORD" \
          PROJECT_ID="$PROJECT_ID" REGION="$REGION" WEB_SERVICE="$WEB_SERVICE" WORKER_SERVICE="$WORKER_SERVICE" \
          WEB_URL="$WEB_URL" WORKER_URL="$WORKER_URL" IMAGE="$IMAGE" ALLOW_WEB_IMAGE_PROMOTION=1 \
          STRICT_OCR_QUALITY="$STRICT_OCR_QUALITY" WORKFLOW_V2_DEPLOY_CHECK="$WORKFLOW_V2_DEPLOY_CHECK" ALLOW_BASIC_ONLY_AUTH="$ALLOW_BASIC_ONLY_AUTH" \
          TAG_PREFIX=stg-frontend ./scripts/deploy_web_with_checks.sh
