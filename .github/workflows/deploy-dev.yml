name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Full source SHA covered by the manually submitted local test receipt"
        required: true
        type: string
      local_test_receipt:
        description: "ECDSA-signed JSON envelope created by scripts/local_hospital_test_runner.py"
        required: true
        type: string

env:
  NODE_OPTIONS: --use-openssl-ca
  CLOUDSDK_CORE_CUSTOM_CA_CERTS_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: mythic-lattice-483204-t8
      REGION: asia-northeast1
      REGISTRY: asia-northeast1-docker.pkg.dev/mythic-lattice-483204-t8/backend
      TF_ENV_DIR: infra/terraform/envs/dev
    steps:
      - name: Update TLS trust stores
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          case "$VERSION_ID" in
            22.04|24.04|26.04|26.10) minimum="20260816ubuntu0.${VERSION_ID}.1" ;;
            *) echo "Unsupported Ubuntu CA baseline" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          actual="$(dpkg-query -W -f='${Version}' ca-certificates)"
          dpkg --compare-versions "$actual" ge "$minimum"
          printf 'ca-certificates=%s\n' "$actual"
          printf '%s\n' 'SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt' \
            'SSL_CERT_DIR=/etc/ssl/certs' \
            'PIP_CERT=/etc/ssl/certs/ca-certificates.crt' >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require owner and exact successful local hospital test receipt
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          LOCAL_TEST_RECEIPT: ${{ inputs.local_test_receipt }}
          SAWA_LOCAL_TEST_PUBLIC_KEY: ${{ vars.SAWA_LOCAL_TEST_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git check-ref-format "refs/heads/$GITHUB_REF_NAME"
          git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$EXPECTED_SOURCE_SHA"
          printf '%s' "$LOCAL_TEST_RECEIPT" > "$RUNNER_TEMP/local-test-receipt.json"
          python3 scripts/local_hospital_test_runner.py --validate "$RUNNER_TEMP/local-test-receipt.json" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-definition-sha256 "$(sha256sum scripts/local_hospital_test_manifest.json | awk '{print $1}')"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT_DEV }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Set image tags
        run: |
          TAG_SUFFIX=$(date -u +%Y%m%d-%H%M%S)
          echo "TAG_SUFFIX=${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "FRONTEND_TAG=dev-frontend-${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "BACKEND_TAG=dev-backend-${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "OCR_TAG=dev-ocr-${TAG_SUFFIX}" >> "$GITHUB_ENV"
      - name: Build and push images
        run: |
          docker build -t "${REGISTRY}/frontend:${FRONTEND_TAG}" -f frontend/Dockerfile frontend
          docker push "${REGISTRY}/frontend:${FRONTEND_TAG}"
          docker build -t "${REGISTRY}/backend:${BACKEND_TAG}" -f backend/Dockerfile backend
          docker push "${REGISTRY}/backend:${BACKEND_TAG}"
          docker build -t "${REGISTRY}/ocr-pipeline:${OCR_TAG}" -f ocr_pipeline/Dockerfile ocr_pipeline
          docker push "${REGISTRY}/ocr-pipeline:${OCR_TAG}"
      - name: Write terraform override
        run: |
          cat > "${TF_ENV_DIR}/terraform.auto.tfvars.json" <<EOF
          {
            "cloudrun_services": {
              "web": "${REGISTRY}/frontend:${FRONTEND_TAG}",
              "worker": "${REGISTRY}/backend:${BACKEND_TAG}",
              "ocr-pipeline": "${REGISTRY}/ocr-pipeline:${OCR_TAG}"
            }
          }
          EOF
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -backend-config=backend.hcl
      - name: Terraform apply
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars
