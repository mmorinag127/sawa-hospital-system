name: Deploy Dev

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: mythic-lattice-483204-t8
      REGION: asia-northeast1
      REGISTRY: asia-northeast1-docker.pkg.dev/mythic-lattice-483204-t8/backend
      TF_ENV_DIR: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Set image tags
        run: |
          TAG_SUFFIX=$(date -u +%Y%m%d-%H%M%S)
          echo "TAG_SUFFIX=${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "FRONTEND_TAG=dev-frontend-${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "BACKEND_TAG=dev-backend-${TAG_SUFFIX}" >> "$GITHUB_ENV"
          echo "OCR_TAG=dev-ocr-${TAG_SUFFIX}" >> "$GITHUB_ENV"
      - name: Build and push images
        run: |
          docker build -t "${REGISTRY}/frontend:${FRONTEND_TAG}" -f frontend/Dockerfile frontend
          docker push "${REGISTRY}/frontend:${FRONTEND_TAG}"
          docker build -t "${REGISTRY}/backend:${BACKEND_TAG}" -f backend/Dockerfile backend
          docker push "${REGISTRY}/backend:${BACKEND_TAG}"
          docker build -t "${REGISTRY}/ocr-pipeline:${OCR_TAG}" -f ocr_pipeline/Dockerfile ocr_pipeline
          docker push "${REGISTRY}/ocr-pipeline:${OCR_TAG}"
      - name: Write terraform override
        run: |
          cat > "${TF_ENV_DIR}/terraform.auto.tfvars.json" <<EOF
          {
            "cloudrun_services": {
              "web": "${REGISTRY}/frontend:${FRONTEND_TAG}",
              "worker": "${REGISTRY}/backend:${BACKEND_TAG}",
              "ocr-pipeline": "${REGISTRY}/ocr-pipeline:${OCR_TAG}"
            }
          }
          EOF
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -backend-config=backend.hcl
      - name: Terraform apply
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars
